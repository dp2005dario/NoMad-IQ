# APK de ECLIPTA apuntando al servidor de verdad (Azure), lista para instalar
# en un móvil Android.
#
# Cómo bajarla: GitHub → pestaña "Actions" → "APK para el móvil" → la última
# ejecución en verde → abajo, en "Artifacts", "eclipta-apk". Es un .zip con
# el .apk dentro.
#
# Se hace sola al cambiar la app en main. Para hacerla a mano (o con otra
# dirección de servidor): "Actions" → "APK para el móvil" → "Run workflow".
#
# Firma: con tu llave de subida si están los secretos de GitHub
# ANDROID_KEYSTORE_BASE64 (el .jks en base64) y ANDROID_KEYSTORE_PASSWORD
# (Settings → Secrets and variables → Actions). Así todas las APK llevan la
# misma firma: se actualizan sin desinstalar y la huella SHA-1 de "Continuar
# con Google" no cambia. Sin esos secretos se firma con una llave de pruebas
# distinta en cada ejecución.
name: APK para el móvil

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Dirección del servidor (https://...)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/apk.yml"
  pull_request:
    paths:
      - ".github/workflows/apk.yml"

permissions:
  contents: read

env:
  # La dirección del servidor de Azure (no es un secreto: es pública).
  SERVIDOR: https://eclipta-qlk7qx.denmarkeast.cloudapp.azure.com
  # "Continuar con Google": el ID de cliente WEB de Google Cloud (no es un
  # secreto; el mismo que GOOGLE_CLIENT_ID en config.env del servidor).
  GOOGLE_CLIENT_ID: 668367557673-et1a2d6a29dvnaf3sqctplelr4a44rom.apps.googleusercontent.com

jobs:
  apk:
    name: compilar APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get --enforce-lockfile
      - name: Llave de firma (si está en los secretos)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::warning::Sin secretos de firma: APK firmada con una llave de pruebas temporal."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=upload"
            echo "keyPassword=$KEYSTORE_PASS"
          } > android/key.properties
      - name: Compilar APK
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          URL="${API_URL:-$SERVIDOR}"
          case "$URL" in
            https://*) ;;
            *) echo "La dirección tiene que empezar por https://" >&2; exit 1 ;;
          esac
          echo "Servidor: $URL"
          flutter build apk --release --dart-define=NOMADIQ_API_URL="$URL" \
            --dart-define=NOMADIQ_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: eclipta-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
