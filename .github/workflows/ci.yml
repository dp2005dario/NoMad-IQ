# Integración continua: se ejecuta en cada push y Pull Request.
# Si algo falla aquí, el cambio no debería fusionarse.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # mínimo privilegio también para la CI

jobs:
  # Cada "job" corre en una máquina virtual limpia de GitHub (ubuntu-latest).
  # Los tres jobs de abajo se ejecutan en paralelo salvo que uno dependa de otro (needs).
  proto:
    name: Contratos proto
    runs-on: ubuntu-latest
    steps:
      # Descarga el código. fetch-depth: 0 trae todo el historial, necesario
      # para comparar los contratos con main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Instalar buf y plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Lint
        working-directory: proto
        run: buf lint
      - name: Cambios incompatibles frente a main
        if: github.event_name == 'pull_request'
        working-directory: proto
        # Si main aún no tiene proto/ (primer PR), no hay nada con qué comparar.
        run: |
          if git cat-file -e origin/${{ github.base_ref }}:proto/buf.yaml 2>/dev/null; then
            buf breaking --against "../.git#branch=origin/${{ github.base_ref }},subdir=proto"
          else
            echo "main todavía no tiene contratos: se omite la comprobación"
          fi
      - name: El código generado está al día
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code -- ../gen || (echo "Ejecuta 'make proto' y sube gen/" && exit 1)

  flight-ingestor:
    name: flight-ingestor (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flight-ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/flight-ingestor/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  price-consumer:
    name: price-consumer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/price-consumer/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  notifier:
    name: notifier (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/notifier/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  auth-gateway:
    name: auth-gateway (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-gateway
    steps:
      - uses: actions/checkout@v4
      # Instala Java 21 (Temurin) y guarda en caché las librerías de Maven
      # entre ejecuciones para no descargarlas cada vez.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/auth-gateway/pom.xml
      # verify = compilar (avisos como errores) + tests unitarios + tests de
      # integración con PostgreSQL y Redis reales (Testcontainers usa el Docker
      # que ya trae la máquina de GitHub).
      - name: Compilar y pasar todos los tests
        run: ./mvnw -B -ntp verify

  ai-orchestrator:
    name: ai-orchestrator (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      # uv instala Python 3.13 y las librerías EXACTAS de uv.lock (con caché).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/ai-orchestrator/uv.lock
      - name: Instalar dependencias (falla si uv.lock no está al día)
        run: uv sync --locked
      - name: El código generado desde proto/ está al día
        run: |
          uv run python scripts/generate_proto.py
          git diff --exit-code -- src/nomadiq || (echo "Ejecuta 'make proto-python' y sube src/nomadiq" && exit 1)
      - name: Formato y estilo (ruff)
        run: uv run ruff format --check . && uv run ruff check .
      - name: Tipos (mypy estricto)
        run: uv run mypy
      # Sin Ollama real: los tests usan un LLM falso con respuestas de guion.
      - name: Tests unitarios
        run: uv run pytest -q

  geo-engine:
    name: geo-engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geo-engine
    steps:
      - uses: actions/checkout@v4
      # rustup ya viene instalado en la máquina de GitHub: lee
      # rust-toolchain.toml e instala Rust 1.97.0 con clippy y rustfmt.
      - name: Instalar Rust (versión de rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      # Guarda las librerías compiladas entre ejecuciones (de ~3 min a segundos).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/geo-engine
      - name: Formato (cargo fmt)
        run: cargo fmt --check
      # --locked: falla si Cargo.lock no está al día. -D warnings: cualquier
      # aviso de clippy (el "revisor automático" de Rust) cuenta como error.
      - name: Clippy (avisos como errores)
        run: cargo clippy --locked --all-targets -- -D warnings
      # Unitarios + mTLS. Los de integración (#[ignore]) van en el job de abajo.
      - name: Tests
        run: cargo test --locked

  mobile:
    name: app móvil (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Java 17 para compilar la parte Android (Gradle).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Misma versión de Flutter que se usa en local (ver docs/guia-app-movil.md).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      # pub get también genera el código de las traducciones (lib/l10n/generated).
      - name: Dependencias (falla si pubspec.lock no está al día)
        run: flutter pub get --enforce-lockfile
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis estático (avisos como errores)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Tests
        run: flutter test
      # Comprueba que la app compila de verdad para Android (APK de pruebas).
      - name: Compilar APK (debug)
        run: flutter build apk --debug

  integration:
    name: Integración (docker compose + Kafka real)
    runs-on: ubuntu-latest
    needs: [flight-ingestor, price-consumer, notifier, auth-gateway, ai-orchestrator, geo-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            services/flight-ingestor/go.sum
            services/price-consumer/go.sum
            services/notifier/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/ai-orchestrator/uv.lock
      - name: Instalar Rust (versión de rust-toolchain.toml)
        working-directory: services/geo-engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/geo-engine
      - name: Generar secretos efímeros para la CI
        working-directory: infrastructure
        run: |
          {
            echo "POSTGRES_USER=nomadiq"
            echo "POSTGRES_DB=nomadiq"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "QDRANT_API_KEY=$(openssl rand -hex 24)"
            echo "KAFKA_CLUSTER_ID=$(docker run --rm apache/kafka:3.9.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
            echo "NOTIFY_PSEUDONYM_KEY=$(openssl rand -hex 32)"
            echo "NOTIFY_TOKEN_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Levantar infraestructura
        working-directory: infrastructure
        run: |
          docker compose up -d --wait kafka postgres redis qdrant
          docker compose up --exit-code-from kafka-init kafka-init
      - name: Tests de integración contra Kafka
        working-directory: services/flight-ingestor
        env:
          KAFKA_BROKERS: localhost:29092
        run: go test -tags integration -count=1 ./internal/publisher/
      - name: Construir y arrancar flight-ingestor, price-consumer, auth-gateway, ai-orchestrator, geo-engine y notifier
        working-directory: infrastructure
        env:
          SEED_WATCHES: MAD-NRT:2026-12-01:ECONOMY
          SEED_SUBSCRIPTIONS: ci-user|MAD-NRT:2026-12-01:ECONOMY
          POLL_INTERVAL: 10s
        run: |
          docker compose --profile apps up -d --build --wait flight-ingestor price-consumer auth-gateway ai-orchestrator geo-engine notifier fcm-fake edge
          curl -fsS http://127.0.0.1:8081/readyz
          curl -fsS http://127.0.0.1:8082/readyz
          curl -fsS http://127.0.0.1:8084/readyz
          # Sin Ollama en la CI: el ai-orchestrator debe estar listo igualmente (plan B por reglas).
          curl -fsS http://127.0.0.1:8086/readyz
          # El geo-engine está listo cuando ha cargado aeropuertos y zonas de PostGIS.
          curl -fsS http://127.0.0.1:8087/readyz | jq -e '.ready and .snapshot.airports > 1000 and .geofence_stream == "running"'
          # El notifier está listo cuando llega a Kafka, PostgreSQL y Redis.
          curl -fsS http://127.0.0.1:8090/readyz | jq -e '.ready'
      - name: auth-gateway en su contenedor (registro, login y token)
        run: |
          set -euo pipefail
          api=http://127.0.0.1:8083
          body='{"email":"ci@example.com","password":"caballo correcto grapa pila"}'
          curl -fsS -X POST "$api/v1/auth/register" -H 'Content-Type: application/json' -d "$body"
          token=$(curl -fsS -X POST "$api/v1/auth/login" -H 'Content-Type: application/json' -d "$body" | jq -er .access_token)
          curl -fsS "$api/v1/me" -H "Authorization: Bearer $token" | jq -e '.email == "ci@example.com"'
          # Sin token: 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/v1/me")" = 401
      - name: Puerta de entrada (Traefik) de punta a punta, como la app móvil
        run: |
          set -euo pipefail
          edge=http://127.0.0.1:8080
          body='{"email":"edge@example.com","password":"caballo correcto grapa pila"}'
          curl -fsS -X POST "$edge/v1/auth/register" -H 'Content-Type: application/json' -d "$body"
          token=$(curl -fsS -X POST "$edge/v1/auth/login" -H 'Content-Type: application/json' -d "$body" | jq -er .access_token)
          # Sin token, o con identidad inventada, la puerta corta: 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$edge/v1/zones?bbox=-3.75,40.38,-3.65,40.45")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-User-ID: otra' -H 'X-User-Roles: USER' "$edge/v1/zones?bbox=-3.75,40.38,-3.65,40.45")" = 401
          # Con token: zonas de demo de Madrid en GeoJSON.
          curl -fsS -H "Authorization: Bearer $token" "$edge/v1/zones?bbox=-3.75,40.38,-3.65,40.45" | jq -e '.type == "FeatureCollection" and (.features | length) >= 1'
          # Posición en la Puerta del Sol: aceptada y publicada en Kafka.
          now=$(($(date +%s) * 1000))
          curl -fsS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$edge/v1/positions" \
            -d "{\"language\":\"es\",\"positions\":[{\"lat\":40.4168,\"lon\":-3.7038,\"accuracy_m\":10,\"recorded_at_ms\":$now}]}" | jq -e '.accepted == 1'
          # Rutas internas que no están en la puerta: 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$edge/v1/admin/users/x/disable")" = 404
      - name: El bucle está cerrado (los precios del ingestor llegan a PostgreSQL)
        working-directory: infrastructure
        run: |
          for i in $(seq 1 30); do
            # Va antes de los tests de integración: así solo cuenta precios del ingestor.
            n=$(docker compose exec -T postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM flights.price_observations"')
            echo "observaciones guardadas: $n"
            [ "$n" -ge 2 ] && exit 0
            sleep 3
          done
          exit 1
      - name: Tests de integración del price-consumer (PostgreSQL + Kafka reales)
        working-directory: services/price-consumer
        env:
          KAFKA_BROKERS: localhost:29092
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB"
          go test -race -tags integration -count=1 ./internal/store/ ./internal/kafka/
      - name: Tests de integración del ai-orchestrator (PostgreSQL + Kafka reales, LLM falso)
        working-directory: services/ai-orchestrator
        env:
          KAFKA_BROKERS: localhost:29092
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB" REDIS_HOST=localhost
          uv sync --locked
          uv run pytest -m integration -q
      # PostGIS y Redis reales, más e2e contra el contenedor: gRPC (con la
      # caché de rutas en Redis) y geofencing (posición en Kafka → evento de entrada).
      - name: Tests de integración del geo-engine (PostGIS, Redis, Kafka y e2e)
        working-directory: services/geo-engine
        env:
          KAFKA_BROKERS: localhost:29092
          GEO_ENGINE_GRPC: http://127.0.0.1:50052
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB" REDIS_HOST=localhost
          cargo test --locked --test integration -- --ignored
      - name: Tests de integración del notifier (PostgreSQL y Redis reales)
        working-directory: services/notifier
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB" REDIS_HOST=localhost
          go test -race -tags integration -count=1 ./internal/store/ ./internal/antispam/
      # Notificaciones push de punta a punta, con los contenedores reales: el
      # test hace de teléfono (claves propias + registro en la API), publica
      # posiciones en Kafka y comprueba que al FCM falso llega UN aviso cifrado
      # que solo él sabe abrir; que el enfriamiento calla el segundo; y que un
      # teléfono desinstalado (UNREGISTERED) se olvida.
      - name: Notificaciones push de punta a punta (geo-engine → notifier → FCM falso)
        working-directory: services/notifier
        env:
          NOTIFIER_E2E: "1"
          KAFKA_BROKERS: localhost:29092
        run: go test -tags integration -count=1 -v -run TestPushNotificationEndToEnd ./internal/e2e/
      # El recorrido completo de las audioguías, con los contenedores reales:
      # el e2e del geo-engine metió a un usuario en la Puerta del Sol → entrada
      # anónima en geo.zone-entries.v1 → el ai-orchestrator la consume y deja el
      # guion de "madrid-centro" en Redis (sin Ollama en la CI: plan B por reglas).
      - name: Audioguía de la zona generada de punta a punta (geo-engine → Kafka → ai-orchestrator → Redis)
        working-directory: infrastructure
        run: |
          set -euo pipefail
          zone=$(docker compose exec -T postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT zone_id FROM geo.zones WHERE slug = '"'"'madrid-centro'"'"'"')
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/guide.json -w '%{http_code}' "http://127.0.0.1:8085/v1/audioguides/${zone}?lang=es" -H 'X-User-ID: ci-user' -H 'X-User-Roles: USER')
            if [ "$code" = 200 ]; then
              jq -e '.language == "es" and (.segments | length) >= 2 and (.source == "rules" or .source == "llm")' /tmp/guide.json
              exit 0
            fi
            sleep 2
          done
          echo "la audioguía no apareció (último código: $code)"
          exit 1
      # La voz: el worker de audio graba con Piper la audioguía de madrid-centro
      # (una sola voz en la CI, la española, para ir rápido) y la API la sirve
      # con URLs inmutables. Después se corrige un hecho y se comprueba que el
      # outbox (trigger → cola → worker) graba la versión nueva en otra ruta.
      - name: Audio de la audioguía con Piper (outbox → worker → Opus → API)
        working-directory: infrastructure
        env:
          AUDIO_POLL_SECONDS: "5"
        run: |
          set -euo pipefail
          ./tts/download-voices.sh es
          docker compose --profile apps --profile audio up -d --build --wait audio-worker
          curl -fsS http://127.0.0.1:8088/readyz | jq -e '.checks.audio_worker'
          psql_q() { docker compose exec -T -e Q="$1" postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$Q"'; }
          zone=$(psql_q "SELECT zone_id FROM geo.zones WHERE slug = 'madrid-centro'")
          api="http://127.0.0.1:8085/v1/audioguides/${zone}/audio?lang=es"
          auth=(-H 'X-User-ID: ci-user' -H 'X-User-Roles: USER')
          manifest() { curl -s -o /tmp/audio.json -w '%{http_code}' "$api" "${auth[@]}"; }
          for i in $(seq 1 60); do
            [ "$(manifest)" = 200 ] && break
            sleep 3
          done
          jq -e '(.parts | length) >= 2 and .stale == false and .voice == "es-carlfm-x-low"' /tmp/audio.json
          first=$(jq -r '.parts[0].url' /tmp/audio.json)
          v1=$(jq -r '.audio_content_version' /tmp/audio.json)
          # El archivo: Ogg Opus, cacheable "para siempre" y sin pedir identidad.
          curl -fsS -D /tmp/headers -o /tmp/part.opus "http://127.0.0.1:8085${first}"
          grep -qi '^content-type: audio/ogg' /tmp/headers
          grep -qi '^cache-control: public, max-age=31536000, immutable' /tmp/headers
          [ "$(head -c 4 /tmp/part.opus)" = OggS ]
          # Corregimos un hecho: sube la versión, el trigger apunta el trabajo y
          # el worker graba la versión nueva en rutas nuevas.
          psql_q "UPDATE ai.zone_facts SET fact = fact WHERE zone_slug = 'madrid-centro' AND language = 'es' AND position = 1"
          for i in $(seq 1 80); do
            if [ "$(manifest)" = 200 ] && jq -e --argjson v "$v1" '.audio_content_version > $v and .stale == false' /tmp/audio.json >/dev/null; then
              second=$(jq -r '.parts[0].url' /tmp/audio.json)
              [ "$second" != "$first" ]
              echo "audio nuevo: $second"
              # Recolector sin ventana de gracia y conservando solo 1 grabación:
              # la vieja se borra y su URL responde 410 con el enlace al
              # manifiesto actual; la nueva sigue sirviéndose.
              docker compose exec -T -e AUDIO_GC_GRACE_DAYS=0 -e AUDIO_GC_KEEP=1 audio-worker ai-orchestrator --gc-audio
              code=$(curl -s -D /tmp/gone-headers -o /tmp/gone.json -w '%{http_code}' "http://127.0.0.1:8085${first}")
              [ "$code" = 410 ]
              grep -qi '^cache-control: no-store' /tmp/gone-headers
              jq -e --arg zone "$zone" '.current_manifest | contains($zone)' /tmp/gone.json
              curl -fsS -o /dev/null "http://127.0.0.1:8085${second}"
              exit 0
            fi
            sleep 3
          done
          echo "el audio de la versión corregida no apareció"; cat /tmp/audio.json; exit 1
      - name: La API del ai-orchestrator exige identidad
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/v1/recommendations)" = 401
          curl -fsS http://127.0.0.1:8085/v1/recommendations -H 'X-User-ID: ci-user' -H 'X-User-Roles: USER' | jq -e '.items | type == "array"'
      # Negociación de grupo de punta a punta contra el contenedor: API -> outbox
      # -> Kafka -> agentes (sin Ollama en la CI: plan B por reglas) -> resultado.
      - name: Negociación de grupo de punta a punta (API → Kafka → agentes → resultado)
        run: |
          ana='X-User-ID: ci-ana'; beto='X-User-ID: ci-beto'; role='X-User-Roles: USER'
          body='{"title":"CI","currency":"EUR","members":["ci-beto"],"options":[
            {"option_id":"lisboa","label":"Lisboa","price_minor":30000,"tags":["playa"]},
            {"option_id":"roma","label":"Roma","price_minor":40000,"tags":["museos"]}]}'
          id=$(curl -fsS -X POST http://127.0.0.1:8085/v1/group-negotiations -H "$ana" -H "$role" \
                 -H 'Content-Type: application/json' -d "$body" | jq -r .negotiation_id)
          for who in "$ana" "$beto"; do
            curl -fsS -X PUT "http://127.0.0.1:8085/v1/group-negotiations/$id/preferences" -H "$who" -H "$role" \
              -H 'Content-Type: application/json' -d '{"budget_max_minor":35000,"interests":["playa"]}' >/dev/null
          done
          for i in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:8085/v1/group-negotiations/$id" -H "$beto" -H "$role" > /tmp/neg.json
            if jq -e '.status == "concluded"' /tmp/neg.json >/dev/null; then
              cat /tmp/neg.json
              # Roma (400 €) supera los 350 € de presupuesto: solo puede ganar Lisboa.
              jq -e '.result.chosen_option_id == "lisboa" and .result.excluded_over_budget == ["roma"]' /tmp/neg.json
              # Las preferencias privadas se borraron al terminar.
              jq -e '.my_preferences == null' /tmp/neg.json
              exit 0
            fi
            sleep 3
          done
          echo "la negociación no terminó"; cat /tmp/neg.json; exit 1
      - name: Logs si algo falla
        if: failure()
        working-directory: infrastructure
        run: docker compose --profile apps --profile audio logs --tail=100
      - name: Apagar
        if: always()
        working-directory: infrastructure
        run: docker compose --profile apps --profile audio down -v
