# Integración continua: se ejecuta en cada push y Pull Request.
# Si algo falla aquí, el cambio no debería fusionarse.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # mínimo privilegio también para la CI

jobs:
  # Cada "job" corre en una máquina virtual limpia de GitHub (ubuntu-latest).
  # Los tres jobs de abajo se ejecutan en paralelo salvo que uno dependa de otro (needs).
  proto:
    name: Contratos proto
    runs-on: ubuntu-latest
    steps:
      # Descarga el código. fetch-depth: 0 trae todo el historial, necesario
      # para comparar los contratos con main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Instalar buf y plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Lint
        working-directory: proto
        run: buf lint
      - name: Cambios incompatibles frente a main
        if: github.event_name == 'pull_request'
        working-directory: proto
        # Si main aún no tiene proto/ (primer PR), no hay nada con qué comparar.
        run: |
          if git cat-file -e origin/${{ github.base_ref }}:proto/buf.yaml 2>/dev/null; then
            buf breaking --against "../.git#branch=origin/${{ github.base_ref }},subdir=proto"
          else
            echo "main todavía no tiene contratos: se omite la comprobación"
          fi
      - name: El código generado está al día
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code -- ../gen || (echo "Ejecuta 'make proto' y sube gen/" && exit 1)

  flight-ingestor:
    name: flight-ingestor (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flight-ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/flight-ingestor/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  price-consumer:
    name: price-consumer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/price-consumer/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  auth-gateway:
    name: auth-gateway (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-gateway
    steps:
      - uses: actions/checkout@v4
      # Instala Java 21 (Temurin) y guarda en caché las librerías de Maven
      # entre ejecuciones para no descargarlas cada vez.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/auth-gateway/pom.xml
      # verify = compilar (avisos como errores) + tests unitarios + tests de
      # integración con PostgreSQL y Redis reales (Testcontainers usa el Docker
      # que ya trae la máquina de GitHub).
      - name: Compilar y pasar todos los tests
        run: ./mvnw -B -ntp verify

  integration:
    name: Integración (docker compose + Kafka real)
    runs-on: ubuntu-latest
    needs: [flight-ingestor, price-consumer, auth-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            services/flight-ingestor/go.sum
            services/price-consumer/go.sum
      - name: Generar secretos efímeros para la CI
        working-directory: infrastructure
        run: |
          {
            echo "POSTGRES_USER=nomadiq"
            echo "POSTGRES_DB=nomadiq"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "QDRANT_API_KEY=$(openssl rand -hex 24)"
            echo "KAFKA_CLUSTER_ID=$(docker run --rm apache/kafka:3.9.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          } > .env
      - name: Levantar infraestructura
        working-directory: infrastructure
        run: |
          docker compose up -d --wait kafka postgres redis qdrant
          docker compose up --exit-code-from kafka-init kafka-init
      - name: Tests de integración contra Kafka
        working-directory: services/flight-ingestor
        env:
          KAFKA_BROKERS: localhost:29092
        run: go test -tags integration -count=1 ./internal/publisher/
      - name: Construir y arrancar flight-ingestor, price-consumer y auth-gateway
        working-directory: infrastructure
        env:
          SEED_WATCHES: MAD-NRT:2026-12-01:ECONOMY
          SEED_SUBSCRIPTIONS: ci-user|MAD-NRT:2026-12-01:ECONOMY
          POLL_INTERVAL: 10s
        run: |
          docker compose --profile apps up -d --build --wait flight-ingestor price-consumer auth-gateway
          curl -fsS http://127.0.0.1:8081/readyz
          curl -fsS http://127.0.0.1:8082/readyz
          curl -fsS http://127.0.0.1:8084/readyz
      - name: auth-gateway en su contenedor (registro, login y token)
        run: |
          set -euo pipefail
          api=http://127.0.0.1:8083
          body='{"email":"ci@example.com","password":"caballo correcto grapa pila"}'
          curl -fsS -X POST "$api/v1/auth/register" -H 'Content-Type: application/json' -d "$body"
          token=$(curl -fsS -X POST "$api/v1/auth/login" -H 'Content-Type: application/json' -d "$body" | jq -er .access_token)
          curl -fsS "$api/v1/me" -H "Authorization: Bearer $token" | jq -e '.email == "ci@example.com"'
          # Sin token: 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/v1/me")" = 401
      - name: El bucle está cerrado (los precios del ingestor llegan a PostgreSQL)
        working-directory: infrastructure
        run: |
          for i in $(seq 1 30); do
            # Va antes de los tests de integración: así solo cuenta precios del ingestor.
            n=$(docker compose exec -T postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM flights.price_observations"')
            echo "observaciones guardadas: $n"
            [ "$n" -ge 2 ] && exit 0
            sleep 3
          done
          exit 1
      - name: Tests de integración del price-consumer (PostgreSQL + Kafka reales)
        working-directory: services/price-consumer
        env:
          KAFKA_BROKERS: localhost:29092
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB"
          go test -race -tags integration -count=1 ./internal/store/ ./internal/kafka/
      - name: Logs si algo falla
        if: failure()
        working-directory: infrastructure
        run: docker compose --profile apps logs --tail=100
      - name: Apagar
        if: always()
        working-directory: infrastructure
        run: docker compose --profile apps down -v
