# Integración continua: se ejecuta en cada push y Pull Request.
# Si algo falla aquí, el cambio no debería fusionarse.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # mínimo privilegio también para la CI

jobs:
  # Cada "job" corre en una máquina virtual limpia de GitHub (ubuntu-latest).
  # Los tres jobs de abajo se ejecutan en paralelo salvo que uno dependa de otro (needs).
  proto:
    name: Contratos proto
    runs-on: ubuntu-latest
    steps:
      # Descarga el código. fetch-depth: 0 trae todo el historial, necesario
      # para comparar los contratos con main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Instalar buf y plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.47.2
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Lint
        working-directory: proto
        run: buf lint
      - name: Cambios incompatibles frente a main
        if: github.event_name == 'pull_request'
        working-directory: proto
        # Si main aún no tiene proto/ (primer PR), no hay nada con qué comparar.
        run: |
          if git cat-file -e origin/${{ github.base_ref }}:proto/buf.yaml 2>/dev/null; then
            buf breaking --against "../.git#branch=origin/${{ github.base_ref }},subdir=proto"
          else
            echo "main todavía no tiene contratos: se omite la comprobación"
          fi
      - name: El código generado está al día
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code -- ../gen || (echo "Ejecuta 'make proto' y sube gen/" && exit 1)

  flight-ingestor:
    name: flight-ingestor (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flight-ingestor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/flight-ingestor/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  price-consumer:
    name: price-consumer (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/price-consumer/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Tests unitarios (con detector de carreras)
        run: go test -race -count=1 ./...

  auth-gateway:
    name: auth-gateway (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-gateway
    steps:
      - uses: actions/checkout@v4
      # Instala Java 21 (Temurin) y guarda en caché las librerías de Maven
      # entre ejecuciones para no descargarlas cada vez.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/auth-gateway/pom.xml
      # verify = compilar (avisos como errores) + tests unitarios + tests de
      # integración con PostgreSQL y Redis reales (Testcontainers usa el Docker
      # que ya trae la máquina de GitHub).
      - name: Compilar y pasar todos los tests
        run: ./mvnw -B -ntp verify

  ai-orchestrator:
    name: ai-orchestrator (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      # uv instala Python 3.13 y las librerías EXACTAS de uv.lock (con caché).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/ai-orchestrator/uv.lock
      - name: Instalar dependencias (falla si uv.lock no está al día)
        run: uv sync --locked
      - name: El código generado desde proto/ está al día
        run: |
          uv run python scripts/generate_proto.py
          git diff --exit-code -- src/nomadiq || (echo "Ejecuta 'make proto-python' y sube src/nomadiq" && exit 1)
      - name: Formato y estilo (ruff)
        run: uv run ruff format --check . && uv run ruff check .
      - name: Tipos (mypy estricto)
        run: uv run mypy
      # Sin Ollama real: los tests usan un LLM falso con respuestas de guion.
      - name: Tests unitarios
        run: uv run pytest -q

  geo-engine:
    name: geo-engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geo-engine
    steps:
      - uses: actions/checkout@v4
      # rustup ya viene instalado en la máquina de GitHub: lee
      # rust-toolchain.toml e instala Rust 1.97.0 con clippy y rustfmt.
      - name: Instalar Rust (versión de rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      # Guarda las librerías compiladas entre ejecuciones (de ~3 min a segundos).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/geo-engine
      - name: Formato (cargo fmt)
        run: cargo fmt --check
      # --locked: falla si Cargo.lock no está al día. -D warnings: cualquier
      # aviso de clippy (el "revisor automático" de Rust) cuenta como error.
      - name: Clippy (avisos como errores)
        run: cargo clippy --locked --all-targets -- -D warnings
      # Unitarios + mTLS. Los de integración (#[ignore]) van en el job de abajo.
      - name: Tests
        run: cargo test --locked

  integration:
    name: Integración (docker compose + Kafka real)
    runs-on: ubuntu-latest
    needs: [flight-ingestor, price-consumer, auth-gateway, ai-orchestrator, geo-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            services/flight-ingestor/go.sum
            services/price-consumer/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/ai-orchestrator/uv.lock
      - name: Instalar Rust (versión de rust-toolchain.toml)
        working-directory: services/geo-engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/geo-engine
      - name: Generar secretos efímeros para la CI
        working-directory: infrastructure
        run: |
          {
            echo "POSTGRES_USER=nomadiq"
            echo "POSTGRES_DB=nomadiq"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "QDRANT_API_KEY=$(openssl rand -hex 24)"
            echo "KAFKA_CLUSTER_ID=$(docker run --rm apache/kafka:3.9.1 /opt/kafka/bin/kafka-storage.sh random-uuid)"
          } > .env
      - name: Levantar infraestructura
        working-directory: infrastructure
        run: |
          docker compose up -d --wait kafka postgres redis qdrant
          docker compose up --exit-code-from kafka-init kafka-init
      - name: Tests de integración contra Kafka
        working-directory: services/flight-ingestor
        env:
          KAFKA_BROKERS: localhost:29092
        run: go test -tags integration -count=1 ./internal/publisher/
      - name: Construir y arrancar flight-ingestor, price-consumer, auth-gateway, ai-orchestrator y geo-engine
        working-directory: infrastructure
        env:
          SEED_WATCHES: MAD-NRT:2026-12-01:ECONOMY
          SEED_SUBSCRIPTIONS: ci-user|MAD-NRT:2026-12-01:ECONOMY
          POLL_INTERVAL: 10s
        run: |
          docker compose --profile apps up -d --build --wait flight-ingestor price-consumer auth-gateway ai-orchestrator geo-engine
          curl -fsS http://127.0.0.1:8081/readyz
          curl -fsS http://127.0.0.1:8082/readyz
          curl -fsS http://127.0.0.1:8084/readyz
          # Sin Ollama en la CI: el ai-orchestrator debe estar listo igualmente (plan B por reglas).
          curl -fsS http://127.0.0.1:8086/readyz
          # El geo-engine está listo cuando ha cargado aeropuertos y zonas de PostGIS.
          curl -fsS http://127.0.0.1:8087/readyz | jq -e '.ready and .snapshot.airports > 1000 and .geofence_stream == "running"'
      - name: auth-gateway en su contenedor (registro, login y token)
        run: |
          set -euo pipefail
          api=http://127.0.0.1:8083
          body='{"email":"ci@example.com","password":"caballo correcto grapa pila"}'
          curl -fsS -X POST "$api/v1/auth/register" -H 'Content-Type: application/json' -d "$body"
          token=$(curl -fsS -X POST "$api/v1/auth/login" -H 'Content-Type: application/json' -d "$body" | jq -er .access_token)
          curl -fsS "$api/v1/me" -H "Authorization: Bearer $token" | jq -e '.email == "ci@example.com"'
          # Sin token: 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/v1/me")" = 401
      - name: El bucle está cerrado (los precios del ingestor llegan a PostgreSQL)
        working-directory: infrastructure
        run: |
          for i in $(seq 1 30); do
            # Va antes de los tests de integración: así solo cuenta precios del ingestor.
            n=$(docker compose exec -T postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM flights.price_observations"')
            echo "observaciones guardadas: $n"
            [ "$n" -ge 2 ] && exit 0
            sleep 3
          done
          exit 1
      - name: Tests de integración del price-consumer (PostgreSQL + Kafka reales)
        working-directory: services/price-consumer
        env:
          KAFKA_BROKERS: localhost:29092
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB"
          go test -race -tags integration -count=1 ./internal/store/ ./internal/kafka/
      - name: Tests de integración del ai-orchestrator (PostgreSQL + Kafka reales, LLM falso)
        working-directory: services/ai-orchestrator
        env:
          KAFKA_BROKERS: localhost:29092
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB" REDIS_HOST=localhost
          uv sync --locked
          uv run pytest -m integration -q
      # PostGIS y Redis reales, más e2e contra el contenedor: gRPC (con la
      # caché de rutas en Redis) y geofencing (posición en Kafka → evento de entrada).
      - name: Tests de integración del geo-engine (PostGIS, Redis, Kafka y e2e)
        working-directory: services/geo-engine
        env:
          KAFKA_BROKERS: localhost:29092
          GEO_ENGINE_GRPC: http://127.0.0.1:50052
        run: |
          set -a; . ../../infrastructure/.env; set +a
          export PGHOST=localhost PGUSER="$POSTGRES_USER" PGPASSWORD="$POSTGRES_PASSWORD" PGDATABASE="$POSTGRES_DB" REDIS_HOST=localhost
          cargo test --locked --test integration -- --ignored
      # El recorrido completo de las audioguías, con los contenedores reales:
      # el e2e del geo-engine metió a un usuario en la Puerta del Sol → entrada
      # anónima en geo.zone-entries.v1 → el ai-orchestrator la consume y deja el
      # guion de "madrid-centro" en Redis (sin Ollama en la CI: plan B por reglas).
      - name: Audioguía de la zona generada de punta a punta (geo-engine → Kafka → ai-orchestrator → Redis)
        working-directory: infrastructure
        run: |
          set -euo pipefail
          zone=$(docker compose exec -T postgres sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT zone_id FROM geo.zones WHERE slug = '"'"'madrid-centro'"'"'"')
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/guide.json -w '%{http_code}' "http://127.0.0.1:8085/v1/audioguides/${zone}?lang=es" -H 'X-User-ID: ci-user' -H 'X-User-Roles: USER')
            if [ "$code" = 200 ]; then
              jq -e '.language == "es" and (.segments | length) >= 2 and (.source == "rules" or .source == "llm")' /tmp/guide.json
              exit 0
            fi
            sleep 2
          done
          echo "la audioguía no apareció (último código: $code)"
          exit 1
      - name: La API del ai-orchestrator exige identidad
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/v1/recommendations)" = 401
          curl -fsS http://127.0.0.1:8085/v1/recommendations -H 'X-User-ID: ci-user' -H 'X-User-Roles: USER' | jq -e '.items | type == "array"'
      - name: Logs si algo falla
        if: failure()
        working-directory: infrastructure
        run: docker compose --profile apps logs --tail=100
      - name: Apagar
        if: always()
        working-directory: infrastructure
        run: docker compose --profile apps down -v
