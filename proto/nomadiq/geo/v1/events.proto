syntax = "proto3";

package nomadiq.geo.v1;

import "nomadiq/common/v1/common.proto";
import "nomadiq/geo/v1/geo.proto";

// Eventos geoespaciales que viajan por Kafka.
// Regla de evolución: solo se AÑADEN campos con números nuevos.

// UserPositionReported se publica en "geo.user-positions.v1" cada vez que la
// app informa de la posición de un usuario (con su permiso).
// Clave del mensaje Kafka: user_id. Así todas las posiciones de una persona
// van a la misma partición, las procesa un único consumidor y en orden.
message UserPositionReported {
  // metadata.occurred_at = momento en que el GPS tomó la posición.
  nomadiq.common.v1.EventMetadata metadata = 1;
  string user_id = 2;
  LatLng position = 3;
  // Precisión horizontal del GPS en metros (radio de incertidumbre).
  // Las posiciones demasiado imprecisas se ignoran para no generar avisos falsos.
  double horizontal_accuracy_meters = 4;
  // Idioma preferido del usuario en formato BCP 47 ("es", "en-GB"...). Lo
  // envía la app para que el contenido contextual (audioguías) llegue en su
  // idioma. Opcional: si viene vacío o mal formado se usa el idioma por defecto.
  // El geo-engine solo conserva la parte principal ("en-GB" -> "en"): basta
  // para elegir el idioma y revela menos sobre la persona.
  string preferred_language = 5;
}

// GeofenceTransitionType indica si el usuario entró o salió de una zona.
enum GeofenceTransitionType {
  GEOFENCE_TRANSITION_TYPE_UNSPECIFIED = 0;
  GEOFENCE_TRANSITION_TYPE_ENTER = 1;
  GEOFENCE_TRANSITION_TYPE_EXIT = 2;
}

// GeofenceTransitioned se publica en "geo.geofence-transitions.v1" cuando el
// geo-engine detecta que un usuario cruzó el borde de una zona.
// Clave del mensaje Kafka: user_id.
//
// metadata.event_id es determinista (se deriva de la posición, la zona y el
// tipo): si un fallo hace que se publique dos veces, ambas copias llevan el
// mismo ID y quien consuma puede descartar la repetida.
message GeofenceTransitioned {
  nomadiq.common.v1.EventMetadata metadata = 1;
  string user_id = 2;
  GeofenceTransitionType transition = 3;
  string zone_id = 4;
  string zone_slug = 5;
  string zone_name = 6;
  ZoneKind zone_kind = 7;
  // Posición que provocó el cambio.
  LatLng position = 8;
  // event_id del UserPositionReported que lo provocó (trazabilidad).
  string position_event_id = 9;
}

// ZoneEntered se publica en "geo.zone-entries.v1" cuando un usuario entra
// (con la entrada ya CONFIRMADA por la histéresis) en una zona. Es la versión
// "anónima" de GeofenceTransitioned, pensada para servicios que solo
// necesitan saber QUÉ zona y en QUÉ idioma, nunca QUIÉN ni DÓNDE exactamente
// (por ejemplo, el ai-orchestrator, que prepara la audioguía de la zona).
//
// Minimización de datos (RGPD, Zero Trust): a propósito NO lleva user_id, ni
// coordenadas, ni precisión del GPS, ni el id de la posición original.
// - metadata.event_id es un UUID aleatorio (no derivado de la posición), para
//   que no se pueda enlazar con los eventos que sí identifican al usuario.
// - metadata.occurred_at se redondea hacia abajo al minuto.
// - metadata.correlation_id va vacío por el mismo motivo.
// El vínculo con la persona real lo hace solo la capa de notificaciones,
// leyendo GeofenceTransitioned (que sí lleva user_id).
//
// Clave del mensaje Kafka: zone_id. Todas las entradas a una misma zona van a
// la misma partición, así que las procesa un único consumidor: si entra un
// autobús entero a la vez, ese consumidor genera el contenido una sola vez.
message ZoneEntered {
  nomadiq.common.v1.EventMetadata metadata = 1;
  string zone_id = 2;
  ZoneKind zone_kind = 3;
  // Idioma principal ISO 639 en minúsculas ("es", "en"), o vacío si la app no lo indicó.
  string language = 4;
}
