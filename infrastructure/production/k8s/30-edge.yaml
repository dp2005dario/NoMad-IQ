# La puerta de entrada en producción: el mismo Traefik que en local, ahora
# con https (TLS 1.3) y certificado público GRATIS de Let's Encrypt.
#
#   Internet ──https──► edge (Traefik) ──mTLS──► microservicios
#
# Las reglas (rutas, límites, forwardAuth) salen de edge/dynamic.yml
# convertido por render_edge.py: lo que pruebas en local es lo que corre aquí.
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: nomadiq
spec:
  # k3s publica este servicio en los puertos 80 y 443 de la máquina.
  type: LoadBalancer
  selector: {app: edge}
  ports:
    - {name: http, port: 80, targetPort: 8000}
    - {name: https, port: 443, targetPort: 8443}
---
# Aquí guarda Traefik el certificado de Let's Encrypt (así no lo pide en
# cada reinicio: Let's Encrypt limita cuántos se piden por semana).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-acme
  namespace: nomadiq
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: nomadiq
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: edge}
  template:
    metadata:
      labels: {app: edge}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traefik
          image: mirror.gcr.io/library/traefik:v3.7.16
          env:
            - {name: DOMAIN, valueFrom: {configMapKeyRef: {name: nomadiq-config, key: DOMAIN}}}
            - {name: ACME_EMAIL, valueFrom: {configMapKeyRef: {name: nomadiq-config, key: ACME_EMAIL}}}
          # Configuración estática por argumentos (la de edge/traefik.yml, más
          # https). Mismas defensas: cabeceras disfrazadas fuera, caracteres
          # codificados raros fuera, sin panel, registros sin cabeceras.
          args:
            - --entryPoints.http.address=:8000
            - --entryPoints.http.http.redirections.entryPoint.to=web
            - --entryPoints.http.http.redirections.entryPoint.scheme=https
            - --entryPoints.web.address=:8443
            - --entryPoints.web.http.tls.certResolver=le
            - --entryPoints.web.http.tls.domains[0].main=$(DOMAIN)
            - --entryPoints.web.http.tls.options=modern@file
            - --entryPoints.web.transport.respondingTimeouts.readTimeout=30s
            - --entryPoints.web.transport.respondingTimeouts.writeTimeout=150s
            - --entryPoints.web.transport.respondingTimeouts.idleTimeout=90s
            - --entryPoints.web.http.aliasHeadersStrategy=delete
            - --entryPoints.web.http.encodedCharacters.allowEncodedSlash=false
            - --entryPoints.web.http.encodedCharacters.allowEncodedBackslash=false
            - --entryPoints.web.http.encodedCharacters.allowEncodedNullCharacter=false
            - --entryPoints.web.http.encodedCharacters.allowEncodedSemicolon=false
            - --entryPoints.web.http.encodedCharacters.allowEncodedPercent=false
            - --entryPoints.web.http.encodedCharacters.allowEncodedQuestionMark=false
            - --entryPoints.web.http.encodedCharacters.allowEncodedHash=false
            - --entryPoints.ping.address=:8082
            - --ping.entryPoint=ping
            - --certificatesResolvers.le.acme.email=$(ACME_EMAIL)
            - --certificatesResolvers.le.acme.storage=/acme/acme.json
            - --certificatesResolvers.le.acme.httpChallenge.entryPoint=http
            - --providers.file.directory=/etc/traefik/dynamic
            - --providers.file.watch=false
            - --api.dashboard=false
            - --log.level=INFO
            - --log.format=json
            - --accessLog.format=json
            - --accessLog.fields.headers.defaultMode=drop
            # Ni la IP de quien llama ni la ruta (la ruta puede llevar
            # coordenadas, p. ej. /v1/nearby?lat=...). Solo qué servicio,
            # código de respuesta y tiempo: lo justo para ver si algo falla.
            - --accessLog.fields.names.ClientAddr=drop
            - --accessLog.fields.names.ClientHost=drop
            - --accessLog.fields.names.ClientPort=drop
            - --accessLog.fields.names.ClientUsername=drop
            - --accessLog.fields.names.RequestPath=drop
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
          ports:
            - {containerPort: 8000}
            - {containerPort: 8443}
          readinessProbe:
            httpGet: {path: /ping, port: 8082}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: 8082}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: dynamic, mountPath: /etc/traefik/dynamic, readOnly: true}
            - {name: certs, mountPath: /certs, readOnly: true}
            - {name: acme, mountPath: /acme}
      volumes:
        # edge-dynamic lo crea deploy.sh con render_edge.py + tls-options.yml.
        - {name: dynamic, configMap: {name: edge-dynamic}}
        - {name: certs, secret: {secretName: tls-edge}}
        - {name: acme, persistentVolumeClaim: {claimName: edge-acme}}
