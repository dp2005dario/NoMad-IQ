# Copia de seguridad de PostgreSQL cada noche, CIFRADA, fuera de la máquina.
#
#   1. pg_dump saca una copia de toda la base de datos (formato comprimido).
#   2. rclone la cifra con TU contraseña (BACKUP_PASSPHRASE) ANTES de subirla
#      y la guarda en Oracle Object Storage (20 GB gratis para siempre).
#   3. Borra las copias de más de 14 días (para no pasar de lo gratis).
#
# Oracle solo ve un fichero cifrado: sin tu contraseña no se puede leer.
# Cómo restaurar: docs/guia-produccion.md, sección "Restaurar una copia".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: nomadiq
spec:
  schedule: "30 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app: backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: postgres:17-bookworm   # trae pg_dump y existe para ARM
              command:
                - sh
                - -c
                - pg_dump -Fc -f "/backup/nomadiq-$(date -u +%Y%m%dT%H%M%SZ).dump"
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: POSTGRES_USER}}}
                - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: POSTGRES_PASSWORD}}}
                - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: POSTGRES_DB}}}
                - {name: PGSSLMODE, value: verify-full}
                - {name: PGSSLROOTCERT, value: /certs/ca.crt}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: ca, mountPath: /certs, readOnly: true}
          containers:
            - name: upload
              image: rclone/rclone:1.68.2
              command:
                - sh
                - -c
                - >-
                  export RCLONE_CONFIG_SAFE_PASSWORD="$(rclone obscure "$BACKUP_PASSPHRASE")" &&
                  rclone copy /backup safe: &&
                  rclone delete --min-age 14d safe:
              env:
                # "oci": Oracle Object Storage por su API compatible con S3.
                - {name: RCLONE_CONFIG_OCI_TYPE, value: s3}
                - {name: RCLONE_CONFIG_OCI_PROVIDER, value: Other}
                - {name: RCLONE_CONFIG_OCI_ENDPOINT, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: BACKUP_S3_ENDPOINT}}}
                - {name: RCLONE_CONFIG_OCI_REGION, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: BACKUP_S3_REGION}}}
                - {name: RCLONE_CONFIG_OCI_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: BACKUP_S3_ACCESS_KEY}}}
                - {name: RCLONE_CONFIG_OCI_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: BACKUP_S3_SECRET_KEY}}}
                - {name: RCLONE_CONFIG_OCI_FORCE_PATH_STYLE, value: "true"}
                - {name: BACKUP_BUCKET, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: BACKUP_BUCKET}}}
                # "safe": cifra (nombres y contenido) encima de "oci".
                - {name: RCLONE_CONFIG_SAFE_TYPE, value: crypt}
                - {name: RCLONE_CONFIG_SAFE_REMOTE, value: "oci:$(BACKUP_BUCKET)/postgres"}
                - {name: BACKUP_PASSPHRASE, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: BACKUP_PASSPHRASE}}}
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: backup, emptyDir: {sizeLimit: 10Gi}}
            - {name: tmp, emptyDir: {}}
            - {name: ca, secret: {secretName: tls-postgres, items: [{key: ca.crt, path: ca.crt}]}}
