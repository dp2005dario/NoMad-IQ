# Quién puede hablar con quién dentro del clúster (zero trust).
#
# Analogía: puertas de un edificio con tarjeta. Por defecto TODAS cerradas
# (default-deny); luego se abre solo la puerta que cada uno necesita. Aunque
# alguien colara un programa en un servicio, no podría llegar a la base de
# datos si ese servicio no la usa. Además, con mTLS, sin carné no hay nada.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nomadiq
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Internet solo puede entrar por la puerta (80 para redirigir a https, 443).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-from-internet
  namespace: nomadiq
spec:
  podSelector:
    matchLabels: {app: edge}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8000}, {port: 8443}]
---
# Kafka: solo los pods marcados como clientes de Kafka (y Kafka consigo mismo).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-clients
  namespace: nomadiq
spec:
  podSelector:
    matchLabels: {app: kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {kafka-client: "true"}}
        - podSelector: {matchLabels: {app: kafka}}
      ports: [{port: 9092}]
---
# Las comprobaciones de salud las hace la propia máquina (kubelet), que en
# Oracle está en la red privada 10.0.0.0/16 (la red por defecto de la VCN).
# Si creaste la VCN con otro rango, cámbialo aquí. Prometheus (en su propio
# namespace) también puede leer las sondas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probes-and-monitoring
  namespace: nomadiq
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.0.0.0/16}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: nomadiq-monitoring}
      ports: [{port: 8081}, {port: 8082}, {port: 8084}, {port: 8086}, {port: 8087}, {port: 8090}]
---
