# GENERADO por gen_services.py: no lo edites a mano (cambia la tabla de allí).
#
# Los 7 microservicios de NomadIQ. Todos:
#   - hablan entre sí con mTLS (cada uno con su certificado de 01-pki.yaml);
#   - van a PostgreSQL con verify-full, a Redis y Kafka con TLS;
#   - corren sin root, con el disco del contenedor en solo lectura y un techo
#     de memoria y CPU (si alguno se pasa, Kubernetes lo reinicia: no hay
#     "más máquinas" que pagar).
---
# Las audioguías en .opus: las graba el audio-worker y las lee la API.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audio-data
  namespace: nomadiq
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: flight-ingestor
  namespace: nomadiq
spec:
  selector: {app: flight-ingestor}
  ports:
    - {name: grpc, port: 50051}
    - {name: health, port: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-ingestor
  namespace: nomadiq
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: flight-ingestor}
  template:
    metadata:
      labels: {app: flight-ingestor, kafka-client: "true"}
      annotations:
        prometheus.io/scrape: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: flight-ingestor
          image: nomadiq/flight-ingestor:prod
          # La imagen se construye en la propia máquina (deploy.sh): gratis,
          # sin registro de imágenes de pago.
          imagePullPolicy: Never
          env:
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: KAFKA_TLS_CA_FILE, value: "/certs/ca.crt"}
            - {name: GRPC_TLS_CERT_FILE, value: "/certs/tls.crt"}
            - {name: GRPC_TLS_KEY_FILE, value: "/certs/tls.key"}
            - {name: GRPC_TLS_CLIENT_CA_FILE, value: "/certs/ca.crt"}
            - {name: FARE_PROVIDER, value: "travelpayouts"}
            - {name: TRAVELPAYOUTS_TOKEN, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: TRAVELPAYOUTS_TOKEN}}}
            - {name: TRAVELPAYOUTS_MARKER, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: TRAVELPAYOUTS_MARKER}}}
            - {name: TRAVELPAYOUTS_CURRENCY, value: "EUR"}
            - {name: POLL_INTERVAL, value: "15m"}
            - {name: LOG_LEVEL, value: "info"}
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: certs, mountPath: /certs, readOnly: true}
      volumes:
        - {name: certs, secret: {secretName: tls-flight-ingestor}}
---
