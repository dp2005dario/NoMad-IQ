            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: POSTGRES_DB}}}
            - {name: PGSSLMODE, value: "verify-full"}
            - {name: PGSSLROOTCERT, value: "/certs/ca.crt"}
            - {name: REDIS_HOST, value: "redis"}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: REDIS_PASSWORD}}}
            - {name: REDIS_TLS, value: "true"}
            - {name: REDIS_TLS_CA_FILE, value: "/certs/ca.crt"}
            - {name: TLS_CERT_FILE, value: "/certs/tls.crt"}
            - {name: TLS_KEY_FILE, value: "/certs/tls.key"}
            - {name: TLS_CLIENT_CA_FILE, value: "/certs/ca.crt"}
            - {name: NOTIFY_PSEUDONYM_KEY, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: NOTIFY_PSEUDONYM_KEY}}}
            - {name: NOTIFY_TOKEN_KEY, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: NOTIFY_TOKEN_KEY}}}
            - {name: FCM_PROJECT_ID, valueFrom: {secretKeyRef: {name: nomadiq-secrets, key: FCM_PROJECT_ID}}}
            - {name: FCM_CREDENTIALS_FILE, value: "/fcm/fcm.json"}
            - {name: LOG_LEVEL, value: "info"}
          ports:
            - {name: api, containerPort: 8089}
            - {name: health, containerPort: 8090}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: certs, mountPath: /certs, readOnly: true}
            - {name: fcm, mountPath: /fcm, readOnly: true}
      volumes:
        - {name: certs, secret: {secretName: tls-notifier}}
        - {name: fcm, secret: {secretName: nomadiq-fcm}}
