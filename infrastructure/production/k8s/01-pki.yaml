# Certificados INTERNOS (mTLS) con cert-manager, gratis y automáticos.
#
# Analogía: es la oficina de carnés de la empresa. Hay un sello oficial (la
# CA interna, que solo existe dentro del clúster) y cada servicio recibe su
# carné firmado con ese sello. Cuando dos servicios hablan, se enseñan el
# carné mutuamente (mTLS): si no lo firmó nuestra CA, no hay conversación.
#
# Los carnés duran 90 días y cert-manager los renueva solo 30 días antes.
# Un CronJob (restart-weekly) reinicia los servicios cada domingo para que
# lean el carné nuevo.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: nomadiq
spec:
  selfSigned: {}
---
# El sello: la CA raíz interna (10 años). Su clave nunca sale del clúster.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nomadiq-internal-ca
  namespace: nomadiq
spec:
  isCA: true
  commonName: nomadiq-internal-ca
  secretName: nomadiq-internal-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-ca
  namespace: nomadiq
spec:
  ca:
    secretName: nomadiq-internal-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge
  namespace: nomadiq
spec:
  secretName: tls-edge
  commonName: edge
  dnsNames:
    - edge
    - edge.nomadiq.svc
    - edge.nomadiq.svc.cluster.local
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    # PKCS#8: el formato que entienden todos (Kafka lo exige).
    encoding: PKCS8
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  issuerRef:
    name: internal-ca
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-gateway
  namespace: nomadiq
spec:
  secretName: tls-auth-gateway
  commonName: auth-gateway
  dnsNames:
    - auth-gateway
    - auth-gateway.nomadiq.svc
    - auth-gateway.nomadiq.svc.cluster.local
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    # PKCS#8: el formato que entienden todos (Kafka lo exige).
    encoding: PKCS8
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  # Java (auth-gateway) lee la CA desde un almacén PKCS#12.
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: nomadiq-secrets
        key: JAVA_TRUSTSTORE_PASSWORD
  issuerRef:
    name: internal-ca
    kind: Issuer
---
