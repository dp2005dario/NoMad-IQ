# Entorno de desarrollo local de NomadIQ.
#
#   cp .env.example .env      # y rellena los secretos
#   docker compose up -d      # solo infraestructura
#   docker compose --profile apps up -d --build   # + microservicios
#
# Reglas que sigue este fichero:
#   - Ningún secreto escrito aquí: todo sale de .env y la sintaxis ${VAR:?}
#     hace que compose falle si falta alguno, en vez de usar un valor por defecto.
#   - Los puertos solo se publican en 127.0.0.1: nada queda abierto a tu red local.
#   - Cada servicio tiene healthcheck, y quien depende de él espera a que esté sano.
#   - Versiones de imagen fijadas: el mismo fichero da el mismo entorno siempre.

name: nomadiq

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

services:
  # ---------------------------------------------------------------------------
  # Apache Kafka en modo KRaft: sin ZooKeeper, un solo proceso hace de broker
  # (guarda mensajes) y de controller (gestiona los metadatos del clúster).
  # ---------------------------------------------------------------------------
  kafka:
    <<: *hardening
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Define KAFKA_CLUSTER_ID en .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: tráfico entre contenedores. EXTERNAL: tu máquina (localhost:29092).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Con un único broker, los factores de replicación internos deben ser 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los topics se crean explícitamente (kafka-init), nunca por accidente
      # al publicar en un nombre mal escrito.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Contenedor de un solo uso: crea los topics y termina.
  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 con la extensión PostGIS (datos relacionales + geoespaciales).
  # ---------------------------------------------------------------------------
  postgres:
    <<: *hardening
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      # scram-sha-256: el algoritmo moderno de contraseñas (no md5).
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis: caché en memoria. En local un nodo; en producción, Redis Cluster.
  # ---------------------------------------------------------------------------
  redis:
    <<: *hardening
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      # redis-cli lee la contraseña de aquí, así no aparece en la lista de procesos.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Qdrant: base de datos vectorial para la memoria semántica de los agentes IA.
  # ---------------------------------------------------------------------------
  qdrant:
    <<: *hardening
    image: qdrant/qdrant:v1.13.6
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Define QDRANT_API_KEY en .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"   # API REST
      - "127.0.0.1:6334:6334"   # API gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # La imagen no trae curl: abrimos el socket con bash y pedimos /readyz.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Microservicios (perfil "apps": no arrancan con un "up" a secas).
  # ---------------------------------------------------------------------------
  flight-ingestor:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/flight-ingestor/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    environment:
      KAFKA_BROKERS: kafka:9092
      # Solo en local: en producción el gRPC exige certificados (mTLS).
      GRPC_INSECURE_DEV: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POLL_INTERVAL: ${POLL_INTERVAL:-1m}
      # Rutas de ejemplo para ver eventos sin llamar al gRPC (opcional).
      SEED_WATCHES: ${SEED_WATCHES:-}
      # Probabilidad de simular una tarifa error (0.01 = 1 %). Súbela para ver alertas antes.
      SIMULATED_ERROR_FARE_RATE: ${SIMULATED_ERROR_FARE_RATE:-0.01}
    ports:
      - "127.0.0.1:50051:50051"   # gRPC RouteWatchService
      - "127.0.0.1:8081:8081"     # /healthz y /readyz
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Lee los precios de Kafka, guarda el historial en PostgreSQL, detecta
  # chollos y publica alertas en flights.fare-alerts.v1.
  price-consumer:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/price-consumer/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    environment:
      KAFKA_BROKERS: kafka:9092
      # Mismas variables que usa psql. La contraseña sale de .env, nunca de aquí.
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      # Solo en local: en producción PostgreSQL exige TLS (PGSSLMODE=verify-full).
      PGSSLMODE: disable
      DB_INSECURE_DEV: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Suscripciones de ejemplo para ver alertas sin app móvil (opcional).
      SEED_SUBSCRIPTIONS: ${SEED_SUBSCRIPTIONS:-}
    ports:
      - "127.0.0.1:8082:8082"     # /healthz y /readyz
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # Pasarela de identidad (Java Spring Boot): registro, login y JWT (ES256).
  # Valida tokens sin consultar bases de datos (solo la lista negra en Redis).
  auth-gateway:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/auth-gateway/Dockerfile
    read_only: true
    # Java necesita escribir ficheros temporales: /tmp en memoria, no en disco.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      # Solo en local: en producción todo va con TLS/mTLS (ver services/auth-gateway/README.md)
      # y la clave de firma se monta desde un fichero (JWT_ACTIVE_KEY_FILE).
      PGSSLMODE: disable
      DB_INSECURE_DEV: "true"
      REDIS_TLS: "false"
      REDIS_INSECURE_DEV: "true"
      HTTP_INSECURE_DEV: "true"
      JWT_DEV_EPHEMERAL_KEY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8083:8083"     # API: /v1/auth/*, /v1/me, /.well-known/jwks.json
      - "127.0.0.1:8084:8084"     # /livez y /readyz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Cerebro de IA (Python FastAPI): lee las alertas de chollos de Kafka y las
  # convierte en recomendaciones con un LLM local. Sin Ollama funciona igual,
  # con recomendaciones por reglas (arranca Ollama con el perfil "ai").
  ai-orchestrator:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/ai-orchestrator/Dockerfile
    read_only: true
    # Python necesita un /tmp escribible: en memoria, no en disco.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      KAFKA_BROKERS: kafka:9092
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      # Solo en local: en producción todo va con TLS/mTLS (ver services/ai-orchestrator/README.md).
      PGSSLMODE: disable
      DB_INSECURE_DEV: "true"
      HTTP_INSECURE_DEV: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_INSECURE_DEV: "true"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # Audioguías por zona: la caché de guiones vive en Redis.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      REDIS_TLS: "false"
      REDIS_INSECURE_DEV: "true"
      AUDIOGUIDE_DEFAULT_LANGUAGE: ${AUDIOGUIDE_DEFAULT_LANGUAGE:-en}
      # Audio de las audioguías: lo graba el audio-worker; la API solo lo lee.
      AUDIO_DIR: /var/lib/nomadiq/audio
      EXPOSE_API_DOCS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - audio-data:/var/lib/nomadiq/audio:ro
    ports:
      - "127.0.0.1:8085:8085"     # API: /v1/recommendations (en local sin mTLS)
      - "127.0.0.1:8086:8086"     # /healthz y /readyz
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker de audio: graba las audioguías con Piper (voz local y gratuita) en
  # archivos Opus. Va aparte de la API porque la síntesis de voz gasta mucha
  # CPU: con "cpus" le ponemos un techo para que nunca deje sin CPU al resto.
  # Perfil "audio" (además de "apps"): necesita las voces, que se descargan
  # con "make voices". Se arranca con "make audio-worker".
  audio-worker:
    <<: *hardening
    profiles: ["audio"]
    build:
      context: ..
      dockerfile: services/ai-orchestrator/Dockerfile
      target: audio-worker
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cpus: ${AUDIO_WORKER_CPUS:-1.0}
    mem_limit: 1g
    environment:
      # Kafka no lo usa, pero la configuración común lo pide.
      KAFKA_BROKERS: kafka:9092
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      PGSSLMODE: disable
      DB_INSECURE_DEV: "true"
      HTTP_INSECURE_DEV: "true"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_INSECURE_DEV: "true"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      REDIS_TLS: "false"
      REDIS_INSECURE_DEV: "true"
      AUDIOGUIDE_DEFAULT_LANGUAGE: ${AUDIOGUIDE_DEFAULT_LANGUAGE:-en}
      AUDIO_POLL_SECONDS: ${AUDIO_POLL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - audio-data:/var/lib/nomadiq/audio
      # Las voces, en solo lectura (las descarga tts/download-voices.sh).
      - ./tts/voices:/voices:ro
    ports:
      - "127.0.0.1:8088:8086"     # /healthz y /readyz del worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Motor geoespacial (Rust): aeropuertos cercanos, distancias, orden óptimo de
  # paradas y geofencing en streaming (posiciones de Kafka → entradas/salidas
  # de zonas). Carga sus datos de PostGIS y responde desde la memoria.
  geo-engine:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/geo-engine/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    environment:
      KAFKA_BROKERS: kafka:9092
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      # Solo en local: en producción todo va con TLS/mTLS (ver services/geo-engine/README.md).
      PGSSLMODE: disable
      DB_INSECURE_DEV: "true"
      REDIS_TLS: "false"
      REDIS_INSECURE_DEV: "true"
      GRPC_INSECURE_DEV: "true"
      # Zonas de ejemplo (Madrid, Barcelona, París, Tokio) para ver el geofencing.
      SEED_DEMO_ZONES: ${SEED_DEMO_ZONES:-true}
      # Histéresis del geofencing: para SALIR hay que alejarse más de 30 m del
      # borde, y para ENTRAR hay que seguir dentro 15 s. Evita la "tormenta" de
      # avisos cuando el GPS baila justo en el borde de una zona.
      GEOFENCE_EXIT_MARGIN_M: ${GEOFENCE_EXIT_MARGIN_M:-30}
      GEOFENCE_ENTER_DWELL: ${GEOFENCE_ENTER_DWELL:-15s}
      # Clave de los seudónimos de las notificaciones push (la misma que el
      # notifier). Vacía = el geo-engine no pide avisos. La crea "make keys".
      NOTIFY_PSEUDONYM_KEY: ${NOTIFY_PSEUDONYM_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:50052:50052"   # gRPC GeoService
      - "127.0.0.1:8087:8087"     # /healthz y /readyz
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Notificaciones push (Go): recibe del geo-engine órdenes SEUDÓNIMAS
  # ("avisa a esta persona de que llegó a esta zona"), aplica el anti-spam en
  # Redis, cifra cada aviso para el teléfono y lo entrega por FCM a un ritmo
  # controlado. En local habla con el FCM falso (fcm-fake), no con Google.
  # Las dos claves salen de .env: si faltan, ejecuta "make keys".
  notifier:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/notifier/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    environment:
      KAFKA_BROKERS: kafka:9092
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}
      # Opcionales en compose para no romper un .env antiguo: el notifier se
      # niega a arrancar sin ellas y explica cómo crearlas.
      NOTIFY_PSEUDONYM_KEY: ${NOTIFY_PSEUDONYM_KEY:-}
      NOTIFY_TOKEN_KEY: ${NOTIFY_TOKEN_KEY:-}
      # Anti-spam: un aviso cada 45 min por persona, y nunca la misma zona dos veces al día.
      NOTIFY_COOLDOWN: ${NOTIFY_COOLDOWN:-45m}
      # Solo en local: sin TLS/mTLS y con el FCM falso (ver services/notifier/README.md).
      PGSSLMODE: disable
      DB_INSECURE_DEV: "true"
      REDIS_TLS: "false"
      REDIS_INSECURE_DEV: "true"
      HTTP_INSECURE_DEV: "true"
      FCM_PROJECT_ID: nomadiq-dev
      FCM_ENDPOINT: http://fcm-fake:8099
      FCM_INSECURE_DEV: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8089:8089"     # API: PUT/DELETE /v1/devices/{id} (en local sin mTLS)
      - "127.0.0.1:8090:8090"     # /healthz y /readyz
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fcm-fake:
        condition: service_healthy

  # Firebase Cloud Messaging FALSO: recibe los avisos del notifier y deja
  # verlos en http://127.0.0.1:8099/messages. Solo para desarrollo y CI.
  fcm-fake:
    <<: *hardening
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: services/notifier/Dockerfile
    entrypoint: ["/fcm-fake"]
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/fcm-fake", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8099:8099"

  # Ollama: ejecuta el modelo de lenguaje en tu máquina (gratis, sin enviar
  # datos fuera). Perfil propio porque los modelos ocupan varios GB:
  #   docker compose --profile ai up -d ollama
  #   docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    <<: *hardening
    profiles: ["ai"]
    image: ollama/ollama:0.12.6
    environment:
      # Una petición a la vez por modelo: el ai-orchestrator ya hace cola.
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  backend:
    name: nomadiq-backend

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  qdrant-data:
  ollama-models:
  # Los .opus de las audioguías (en producción: almacén de objetos + CDN).
  audio-data:
