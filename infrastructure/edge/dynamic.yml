# Configuración DINÁMICA de la puerta de entrada: qué ruta va a qué servicio
# y qué controles pasa por el camino. Cualquier ruta que no esté aquí: 404.

http:
  middlewares:
    # 1) Borra cualquier cabecera de identidad que mande el cliente. Si no, un
    #    atacante podría escribir "X-User-ID: <otra persona>" y hacerse pasar
    #    por ella. Solo el paso 2 puede poner estas cabeceras.
    strip-identity:
      headers:
        customRequestHeaders:
          X-User-ID: ""
          X-User-Roles: ""
          X-Token-ID: ""

    # 2) "Forward auth": antes de dejar pasar la petición, Traefik pregunta al
    #    auth-gateway si el token (cabecera Authorization) es válido. Si dice
    #    204, copia quién es el usuario en X-User-ID / X-User-Roles. Si dice
    #    401, la petición se corta aquí y nunca llega al servicio.
    authenticated:
      forwardAuth:
        address: http://auth-gateway:8083/v1/auth/verify
        authResponseHeaders:
          - X-User-ID
          - X-User-Roles
        # No se fía de las cabeceras X-Forwarded-* que mande el cliente.
        trustForwardHeader: false
        # La respuesta del auth-gateway es vacía (204): más de 4 KB es sospechoso.
        maxResponseBodySize: 4096

    # 3) Límite de ritmo por IP (además del de login del auth-gateway).
    rate-limit:
      rateLimit:
        average: 30
        period: 1s
        burst: 60

    # 3 bis) Límite propio del buscador de vuelos, más estricto: buscar es lo
    #    único que puede acabar preguntando al proveedor de precios. 2 por
    #    segundo por IP (ráfagas de 10) sobra para una persona tecleando.
    search-rate-limit:
      rateLimit:
        average: 2
        period: 1s
        burst: 10

    # 4) Cuerpos de petición pequeños: nadie necesita mandar 100 MB.
    small-body:
      buffering:
        maxRequestBodyBytes: 1048576

  routers:
    # Registro, login, renovar y cerrar sesión: el propio auth-gateway valida.
    auth:
      entryPoints: [web]
      rule: PathPrefix(`/v1/auth/`) || Path(`/v1/me`) || Path(`/.well-known/jwks.json`)
      middlewares: [strip-identity, rate-limit, small-body]
      service: auth-gateway

    # Mapa: zonas visibles y envío de posiciones (geo-engine).
    geo:
      entryPoints: [web]
      rule: Path(`/v1/zones`) || Path(`/v1/positions`)
      middlewares: [strip-identity, rate-limit, small-body, authenticated]
      service: geo-engine

    # Audioguías, recomendaciones, negociación de grupo, chat con Flyra, modo cámara, gastos compartidos, quedadas
    # y "borrar mis datos" (ai-orchestrator).
    ai:
      entryPoints: [web]
      rule: PathPrefix(`/v1/audioguides`) || PathPrefix(`/v1/recommendations`) || PathPrefix(`/v1/group-negotiations`) || Path(`/v1/flyra/chat`) || Path(`/v1/menu/translate`) || PathPrefix(`/v1/landmarks`) || PathPrefix(`/v1/expense-groups`) || PathPrefix(`/v1/shared-trips`) || PathPrefix(`/v1/leagues`) || PathPrefix(`/v1/meetups`) || Path(`/v1/me/data`)
      middlewares: [strip-identity, rate-limit, small-body, authenticated]
      service: ai-orchestrator

    # Archivos de audio .opus: públicos e inmutables (su nombre es su huella),
    # así la app y una CDN pueden guardarlos en caché sin token.
    audio-files:
      entryPoints: [web]
      rule: PathPrefix(`/v1/audio/`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Fichas de ciudad (Wikipedia/Wikidata): públicas, para el modo invitado
    # también. Solo GET y con un código de aeropuerto ("/v1/places/MAD").
    places:
      entryPoints: [web]
      rule: Method(`GET`) && PathPrefix(`/v1/places/`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Fotos reales de la calle (Mapillary): públicas como las fichas. La app
    # manda el punto ya redondeado a ~100 m. Solo GET y esa ruta exacta.
    streetview:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/streetview`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Cajeros cercanos (OpenStreetMap): públicos como las fichas. La app manda
    # el punto ya redondeado a ~1 km. Solo GET y esa ruta exacta.
    atms:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/atms`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Cerca de ti (OpenStreetMap): agua, baños, wifi, enchufes y sitios que
    # ver. Público como los cajeros; la app manda la casilla de ~1 km.
    nearby:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/nearby`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Modo coche (OpenStreetMap): gasolineras, aparcamientos, cargadores y
    # zonas ZTL/ZBE. Público; la app manda una casilla de ~5 km.
    drive:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/drive`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Dormir barato (OpenStreetMap): estaciones con alojamientos cerca del
    # sitio al que vas. Público; la app manda una casilla de ~2 km.
    stays:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/stays`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Qué pasa en tus fechas: festivos y eventos de una ciudad. Público; la
    # app manda solo el aeropuerto y las fechas.
    city-events:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/events`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Guía del aeropuerto (OpenStreetMap): pública como los cajeros. Solo GET
    # y solo /v1/airports/<código>/spots.
    airport-guide:
      entryPoints: [web]
      rule: Method(`GET`) && PathRegexp(`^/v1/airports/[A-Za-z]{3}/spots$`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Tipos de cambio del BCE (pestaña Divisas): públicos y gratis, iguales
    # para todos. Solo GET y esa ruta exacta.
    fx:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/fx/rates`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Clima medio de cada mes (Explorar): medias de la NASA, públicas e
    # iguales para todos.
    climate:
      entryPoints: [web]
      rule: Method(`GET`) && Path(`/v1/climate`)
      middlewares: [strip-identity, rate-limit]
      service: ai-orchestrator

    # Vuelos SIN cuenta: chollos e historial de precios. Son iguales para todo
    # el mundo, así que también los ve quien entra como invitado (precios
    # reales para todos). Solo lectura (GET) y con el mismo límite por IP.
    # priority alta: se mira antes que la ruta "fares" de abajo.
    fares-public:
      entryPoints: [web]
      rule: Method(`GET`) && (Path(`/v1/fares/deals`) || PathPrefix(`/v1/fares/history/`))
      priority: 100
      middlewares: [strip-identity, rate-limit]
      service: price-consumer

    # Buscador de vuelos (origen, destino, fechas, viajeros) y precio por
    # meses (Explorar): públicos, como los chollos, pero con su límite más
    # estricto.
    fares-search:
      entryPoints: [web]
      rule: Method(`GET`) && (Path(`/v1/fares/search`) || Path(`/v1/fares/months`))
      priority: 100
      middlewares: [strip-identity, search-rate-limit]
      service: price-consumer

    # Vuelos CON cuenta: rutas vigiladas y avisos de precio (price-consumer).
    fares:
      entryPoints: [web]
      rule: PathPrefix(`/v1/fares/`)
      middlewares: [strip-identity, rate-limit, small-body, authenticated]
      service: price-consumer

    # Registro del móvil para las notificaciones push (notifier).
    devices:
      entryPoints: [web]
      rule: PathPrefix(`/v1/devices/`)
      middlewares: [strip-identity, rate-limit, small-body, authenticated]
      service: notifier

  services:
    auth-gateway:
      loadBalancer:
        servers: [{ url: "http://auth-gateway:8083" }]
    geo-engine:
      loadBalancer:
        servers: [{ url: "http://geo-engine:8090" }]
    ai-orchestrator:
      loadBalancer:
        servers: [{ url: "http://ai-orchestrator:8085" }]
    price-consumer:
      loadBalancer:
        servers: [{ url: "http://price-consumer:8092" }]
    notifier:
      loadBalancer:
        servers: [{ url: "http://notifier:8089" }]
