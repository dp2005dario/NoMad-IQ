# Ficha del proyecto Python (el equivalente al go.mod de Go o al pom.xml de Java).
# La lee "uv", el gestor de paquetes que usamos: instala las librerías de
# "dependencies" y las fija con su versión exacta en uv.lock, para que tu
# portátil, la CI y el contenedor Docker usen EXACTAMENTE lo mismo.
[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Orquestador de IA de NomadIQ: convierte alertas de precio en recomendaciones fundamentadas con un LLM local (Ollama)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Servidor web asíncrono y validación de datos con tipos.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Cliente HTTP asíncrono: habla con Ollama y Qdrant SIN bloquear.
    "httpx>=0.27",
    # Cliente de Kafka asíncrono.
    "aiokafka>=0.12",
    # Driver asíncrono de PostgreSQL.
    "asyncpg>=0.30",
    # Lee los mensajes protobuf que viajan por Kafka.
    "protobuf>=6.31,<7",
]

[dependency-groups]
# Herramientas que solo se usan al programar y en la CI (no van al contenedor).
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "asyncpg-stubs>=0.30",
    "types-protobuf>=6.30",
    # Genera el código Python a partir de los .proto (ver scripts/generate_proto.py).
    "grpcio-tools>=1.73",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Dos paquetes: nuestro código y el código generado desde proto/.
packages = ["src/ai_orchestrator", "src/nomadiq"]

[project.scripts]
ai-orchestrator = "ai_orchestrator.__main__:main"

# --- Calidad de código -----------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py313"
# El código generado no se revisa: no lo escribimos nosotros.
extend-exclude = ["src/nomadiq"]

[tool.ruff.lint]
# E/F: errores básicos; I: orden de imports; B: fallos típicos; UP: sintaxis
# moderna; ASYNC: llamadas que bloquean dentro de código asíncrono (clave aquí);
# S: problemas de seguridad; RUF: reglas extra de ruff.
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# En los tests usar "assert" es lo normal.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
# Modo estricto: todo tiene que llevar tipos. Así muchos errores aparecen
# al escribir el código y no en producción a las 3 de la mañana.
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["ai_orchestrator"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Librerías sin anotaciones de tipos.
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: necesita Kafka y PostgreSQL reales (make up)"]
# Por defecto NO se ejecutan los de integración; la CI los pide con -m integration.
addopts = "-m 'not integration'"
