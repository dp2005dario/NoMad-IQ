# pubspec.yaml es el "carné de identidad" de la app Flutter: nombre, versión,
# librerías que usa (dependencias) y archivos que lleva dentro (fuentes, imágenes).
# Tras cambiarlo, VS Code ejecuta solo "flutter pub get" para descargar lo nuevo.
name: eclipta
description: "ECLIPTA: asistente de viaje con Flyra"
# No se publica en pub.dev (el almacén de librerías): es una app, no una librería.
publish_to: 'none'

# versión visible (1.0.0) + número de compilación (+1). Google Play exige que
# el número tras el "+" suba en cada subida.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Traducciones de Flutter (botones del sistema, fechas...) en todos los idiomas.
  flutter_localizations:
    sdk: flutter
  # Formatos por idioma (números, monedas, plurales). La versión la fija flutter_localizations.
  intl: any
  # Navegación entre pantallas con direcciones tipo web (/inicio, /mapa...).
  go_router: ^18.1.1
  # Guarda ajustes pequeños en el móvil (por ejemplo, el idioma elegido).
  shared_preferences: ^2.5.6
  # Llamadas HTTP al backend (auth-gateway y el resto de servicios).
  http: ^1.6.0
  # Caja fuerte del móvil (Android Keystore / Llavero de iOS) para la sesión.
  flutter_secure_storage: ^11.2.0
  # El mapa: MapLibre (gratis y de código abierto, dibuja con la tarjeta
  # gráfica). Elegido en vez de Google Maps: 0 €, colores propios y privacidad.
  maplibre_gl: ^0.27.1
  # El GPS: permiso de ubicación y posiciones según te mueves.
  geolocator: ^14.1.1
  # El reproductor de las audioguías (en Android usa ExoPlayer, que lee .opus).
  just_audio: ^0.10.6
  # Avisos push: Firebase Cloud Messaging (gratis) despierta al móvil.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Enseña las notificaciones en la barra, con el texto en tu idioma.
  flutter_local_notifications: ^22.3.2
  # X25519, HMAC y AES-GCM para abrir los avisos cifrados (HPKE).
  cryptography: ^2.9.0
  # Genera el número al azar con el que el notifier conoce a este móvil.
  uuid: ^4.6.0
  # Abre la web de reserva de un vuelo en el navegador del móvil.
  url_launcher: ^6.3.2
  # Zonas horarias del mundo (base de datos IANA): "en Tokio son 8 h más".
  timezone: ^0.11.2
  # Un "navegador" dentro de una pantalla: ahí se ve el Vuelo 3D (three.js).
  webview_flutter: ^4.14.1
  # El visor de la cámara y la foto para reconocer monumentos (modo cámara).
  camera: ^0.12.1
  # La brújula: hacia dónde mira el móvil (así se sabe qué monumento apuntas).
  flutter_compass: ^0.8.1
  # La voz del móvil: lee en alto la ficha del monumento (gratis y sin red).
  flutter_tts: ^4.2.5
  # Lee el texto de una foto DENTRO del móvil (ML Kit de Google, gratis y sin
  # red): así Flyra "lee" el ticket de la cena sin mandar la foto a nadie.
  google_mlkit_text_recognition: ^0.17.1
  # Abre la cámara (o la galería) del sistema para hacer la foto del ticket.
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  file_picker: ^13.1.0
  pdfx: ^2.11.0
  path_provider: ^2.1.6
  just_audio_background: ^0.0.1-beta.17
  # Dice si el móvil está en wifi o con datos: así "Sin conexión" no gasta
  # tu tarifa descargando una ciudad en el extranjero sin querer.
  connectivity_plus: ^7.3.1
  # "Compartir": abre el menú del móvil (Instagram, WhatsApp, Guardar en
  # Fotos...) con tus recuerdos. Gratis y sin cuentas.
  share_plus: ^13.3.1
  home_widget: ^0.10.0
  # Asistente: traducir frases DENTRO del móvil (ML Kit, gratis; cada idioma
  # se baja una vez y luego funciona en modo avión).
  google_mlkit_translation: ^0.15.1
  # Asistente: el reconocimiento de voz del sistema (lo que dices, a texto).
  speech_to_text: ^7.5.0
  # El vídeo de fondo de la Bienvenida (en bucle, con música suave).
  video_player: ^2.14.1
  google_sign_in: ^7.2.0
  # Asistente: adivina en qué idioma está una frase (ML Kit, en el móvil y
  # gratis), para cambiar solo el idioma de la otra persona.
  google_mlkit_language_id: ^0.15.1
  flutter_svg: ^2.3.2
  # Sin conexión: "actualizar solas" solo cuando el móvil está cargando.
  battery_plus: ^7.1.2
  google_mlkit_barcode_scanning: ^0.16.1
  qr_flutter: ^4.1.0
  flutter_native_contact_picker: ^0.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Reglas de estilo recomendadas por el equipo de Flutter.
  flutter_lints: ^6.0.0
  # Un "reloj de mentira" para los tests: adelanta minutos en un instante.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Mapa del mundo y aeropuertos para la Ruta del vuelo (ver assets/geo/LEEME.md).
  assets:
    - assets/geo/world.bin
    - assets/geo/airports.txt
    - assets/geo/countries.txt
    - assets/geo/country_names.txt
    - assets/geo/visas.txt
    - assets/geo/country_facts.txt
    - assets/geo/fact_names.txt
    # El Vuelo 3D: una página con three.js ya empaquetado (ver tool/flight3d/).
    - assets/flight3d/vuelo.html
    # Explorar: el globo y el mapa de la maqueta (ver tool/build_explore_page.py).
    - assets/explore/explorar.html
    - assets/nearby/cerca.html
    - assets/stays/hoteles.html
    - assets/copy_trip/copiar.html
    - assets/vault/boveda.html
    - assets/flights/vuelos.html
    - assets/group/grupo.html
    - assets/cards/cromos.html
    - assets/money/bote.html
    - assets/money/dinero.html
    - assets/money/divisas.html
    - assets/plans/planes.html
    - assets/group_chat/chat.html
    - assets/events/eventos.html
    - assets/trip/antes.html
    - assets/push/avisos.html
    - assets/drive/coche.html
    - assets/easy/facil.html
    - assets/audioguide/audioguia.html
    - assets/settings/ajustes.html
    - assets/settings/idioma.html
    - assets/settings/privacidad.html
    - assets/radar/radar.html
    - assets/memories/recuerdos.html
    - assets/route/ruta.html
    # El mapa de verdad de la Ruta del vuelo (MapLibre GL JS 5.24.0, BSD-3).
    - assets/route/maplibre-gl.js
    - assets/route/LICENSE-maplibre.txt
    - assets/offline/sinconexion.html
    - assets/travel_with/viajocon.html
    - assets/visa/visado.html
    - assets/widgets/widgets.html
    - assets/passport/pasaporte.html
    - assets/inicio/inicio.html
    - assets/map/flyra.webp
    # La Bienvenida: vídeo de fondo (720x1280, ~1 MB), logo y la G de Google.
    - assets/video/bienvenida.mp4
    - assets/brand/eclipta_spark.png
    - assets/brand/google_g.png
    # Inicio: fotos e iconos de los cuadrados del carrusel (de la maqueta).
    - assets/inicio/
    # Divisas: fotos de billetes y monedas (licencia sin comprobar, ver LEEME).
    - assets/divisas/aud/
    - assets/divisas/cad/
    - assets/divisas/chf/
    - assets/divisas/cny/
    - assets/divisas/eur/
    - assets/divisas/gbp/
    - assets/divisas/jpy/
    - assets/divisas/mxn/
    - assets/divisas/thb/
    - assets/divisas/try/
    - assets/divisas/usd/
  # Genera el código de traducciones a partir de lib/l10n/*.arb (ver l10n.yaml).
  generate: true
  # Las fuentes van DENTRO de la app (no se descargan de Internet al abrirla):
  # funciona sin conexión y no avisa a terceros de quién usa la app.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    # La letra de máquina de los tickets (Apache 2.0, como Courier New).
    - family: Cousine
      fonts:
        - asset: assets/fonts/Cousine-Regular.ttf
        - asset: assets/fonts/Cousine-Bold.ttf
          weight: 700
