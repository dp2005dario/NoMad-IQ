/* Layout: cabecera, pestañas, mapa 3D plegable arriba, lista de tarjetas con scroll debajo. */
:root{--bg:#0B1217;--panel:#111c23;--panel2:#16252d;--line:rgba(255,255,255,.09);--mint:#3DDC97;--violet:#8B7CF6;--amber:#F5B84B;--red:#F07878;--ink:#E8F1EE;--mut:#8FA3A0;
 --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow:hidden;
 background-image:radial-gradient(70% 36% at 88% 0%,rgba(139,124,246,.28),transparent 70%),radial-gradient(60% 40% at 0% 35%,rgba(61,220,151,.15),transparent 70%),radial-gradient(80% 30% at 50% 100%,rgba(139,124,246,.13),transparent 70%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:8px 8px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
header{display:flex;align-items:center;gap:12px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(22,37,45,.7);display:grid;place-items:center;flex:none}
.back svg{width:18px;height:18px}
.ht{flex:1;min-width:0}
.ht h1{margin:0;font:800 25px/1.05 var(--display)}
.ht p{margin:1px 0 0;color:var(--mut);font-size:12px;font-weight:600}
.ex{font:700 9.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(245,184,75,.45);background:rgba(245,184,75,.1);padding:4px 8px;border-radius:99px;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:4px;padding:4px;border-radius:18px;background:rgba(17,28,35,.85);border:1px solid var(--line);flex:none}
.tab{padding:10px 4px;border-radius:14px;font-weight:700;font-size:13px;color:var(--mut);transition:.25s;white-space:nowrap}
.tab[aria-selected=true]{background:var(--mint);color:#06281a;box-shadow:0 8px 22px -8px rgba(61,220,151,.8)}
/* mapa */
.map{position:relative;flex:none;height:250px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#202a30;touch-action:none;user-select:none;-webkit-user-select:none;isolation:isolate;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.map.big{height:min(52vh,470px)}
.inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.inner.t3d{transform:translate(-50%,-48%) perspective(760px) rotateX(48deg)}
.inner canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 50px rgba(8,13,17,.75);border-radius:inherit;z-index:3}
.haze{position:absolute;inset:0 0 auto 0;height:0;background:linear-gradient(#0f191f,transparent);z-index:2;pointer-events:none;transition:height .5s}
.t3d-on .haze{height:36%}
.pin{position:absolute;left:0;top:0;z-index:4;transform-origin:50% 50%;will-change:transform;cursor:pointer}
.map.walk{height:min(66vh,580px)}
.wp{position:absolute;left:10px;right:10px;bottom:10px;z-index:9;padding:12px;border-radius:20px;background:rgba(10,18,23,.93);border:1px solid rgba(61,220,151,.4);box-shadow:0 14px 34px -10px #000;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:9px}
.wp[hidden]{display:none}
.wr{display:flex;align-items:center;gap:12px}
.tn{flex:none;width:46px;height:46px;border-radius:15px;background:linear-gradient(150deg,#52e8a6,#2fc982);display:grid;place-items:center;color:#06281a}
.tn svg{width:26px;height:26px;transition:transform .3s}
.wt{min-width:0;display:flex;flex-direction:column}
.wt b{font:800 18px/1.15 var(--display)}
.wt span{font-size:12px;color:var(--mut);font-weight:600}
.wb{display:flex;gap:8px}
.wb button{flex:1;padding:9px 6px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.wb button svg{width:15px;height:15px}
.wb .sx{background:rgba(240,120,120,.15);border-color:rgba(240,120,120,.5);color:#ffb0b0}
.wb button[aria-pressed=true]{background:rgba(61,220,151,.2);border-color:var(--mint);color:var(--mint)}
.map.walk .ctrl,.map.walk .sort{display:none}
.pin.arr .bd{animation:arr 1s infinite}
@keyframes arr{50%{box-shadow:0 0 0 14px rgba(61,220,151,.0),0 0 0 4px rgba(61,220,151,.9)}}
.psh{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.6),rgba(0,0,0,0) 70%);pointer-events:none}
.pin::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:var(--stem,14px);margin-top:-2px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0));transform:translateX(-50%)}
.pin .bd{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 6px 14px -3px rgba(0,0,0,.75);transition:transform .25s}
.pin svg{width:21px;height:21px}
.pin.sel{z-index:7}
.pin.sel .bd{transform:scale(1.35);box-shadow:0 0 0 4px rgba(61,220,151,.5),0 10px 22px -4px #000}
.pin .tg{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:800 10px var(--body);white-space:nowrap;background:rgba(8,16,20,.92);border:1px solid rgba(61,220,151,.6);padding:2px 7px;border-radius:99px;color:var(--ink);display:none}
.pin.sel .tg{display:block}
.me{position:absolute;left:0;top:0;z-index:6;pointer-events:none}
.me .d{width:18px;height:18px;border-radius:50%;background:#3DDC97;border:3px solid #fff;box-shadow:0 0 0 6px rgba(61,220,151,.25);animation:pulse 2.4s infinite}
.me .t{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:800 10px var(--body);background:#3DDC97;color:#06281a;padding:2px 7px;border-radius:99px}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(61,220,151,0)}}
.ctrl{position:absolute;right:10px;top:10px;z-index:7;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:36px;height:36px;border-radius:11px;background:rgba(14,24,30,.88);border:1px solid var(--line);display:grid;place-items:center;font:700 17px var(--body);backdrop-filter:blur(8px)}
.ctrl button[aria-pressed=true]{background:var(--mint);color:#06281a}
.ctrl svg{width:18px;height:18px}
.credit{position:absolute;left:10px;bottom:7px;z-index:7;font-size:10px;color:rgba(232,241,238,.55);font-weight:600}
.sort{position:absolute;left:10px;top:10px;z-index:7;font:700 11px var(--body);padding:6px 10px;border-radius:99px;background:rgba(14,24,30,.88);border:1px solid var(--line);color:var(--mut);backdrop-filter:blur(8px)}
.sort b{color:var(--mint)}
/* lista */
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 0 14px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.tools{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600}
.seg{display:flex;gap:4px}
.seg button{padding:5px 10px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--mut)}

.card{position:relative;display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px;border-radius:22px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);animation:up .55s cubic-bezier(.2,.8,.2,1) both;transition:border-color .25s,box-shadow .25s,transform .25s}

.fa{position:relative;width:96px;height:118px;border-radius:16px;overflow:hidden;align-self:start}
.fa>svg{width:100%;height:100%;display:block}
.chapa{position:absolute;left:6px;top:6px;padding:5px 8px 4px;border-radius:11px;text-align:center;color:#101820;box-shadow:0 6px 14px -4px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5);line-height:1}
.chapa b{display:block;font:800 17px var(--display);letter-spacing:-.02em;white-space:nowrap}
.chapa small{display:block;font:800 7.5px var(--body);letter-spacing:.07em;margin-top:2px}
.bg{position:absolute;right:5px;bottom:5px;width:30px;height:30px;border-radius:10px;border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:0 4px 10px -2px #000}
.bg svg{width:17px;height:17px}
.cb{min-width:0;display:flex;flex-direction:column;gap:5px}
.cb h3{margin:0;font:700 15.5px/1.2 var(--display);text-wrap:balance}
.vn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600;flex-wrap:wrap}
.vn svg{width:13px;height:13px;flex:none}
.vn b{color:var(--ink);font-weight:700}
.tm{margin-top:auto}
.tm .tx{font-size:12px;font-weight:800;display:flex;justify-content:space-between;gap:6px}
.pr{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.pr i{display:block;height:100%;border-radius:9px;transition:width 1s}
.row{display:flex;align-items:flex-end;gap:10px}
.row>div:first-child{flex:1;min-width:0}
.go{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:14px;background:linear-gradient(#52e8a6,#2fc982);color:#06281a;font-weight:800;font-size:13px;box-shadow:0 8px 18px -8px rgba(61,220,151,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.go svg{width:14px;height:14px}
.go[aria-pressed=true]{background:#fff}
.empty{padding:22px 18px;border-radius:22px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);color:var(--mut);font-weight:600;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.empty .go{align-self:center}
.foot{font-size:11px;color:var(--mut);padding:2px 4px}
.toast{position:absolute;left:50%;bottom:10px;transform:translate(-50%,30px);opacity:0;z-index:20;background:rgba(8,16,20,.96);border:1px solid var(--mint);padding:8px 14px;border-radius:14px;font-size:12px;font-weight:700;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
