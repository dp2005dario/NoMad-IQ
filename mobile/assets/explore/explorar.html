<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Explorar ECLIPTA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna móvil de 390px; meses arriba, mapamundi real con zoom, ranking de todos los países y hoja inferior de estadísticas. Look único: espacio oscuro. */
:root{
  color-scheme:dark;
  --bg:#0B1217; --panel:#111C23; --panel2:#16252E; --line:#22343f;
  --fg:#E8F1EE; --muted:#8FA6A8; --mint:#3DDC97; --violet:#8B7BFF;
  --amber:#F2B84B; --soft-red:#E0646B; --land-line:#0B1217;
  --f-display:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:400 14px/1.45 var(--f-body);min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.neb{position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(60% 40% at 85% 8%,rgba(139,123,255,.20),transparent 70%),
 radial-gradient(70% 45% at 5% 45%,rgba(61,220,151,.13),transparent 70%),
 radial-gradient(60% 40% at 90% 90%,rgba(139,123,255,.12),transparent 70%)}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;
 padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
 padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font:700 11px var(--f-body);letter-spacing:.28em;color:var(--mint)}
h1{font:700 34px/1 var(--f-display);margin:6px 0 0;letter-spacing:-.02em}
.tag{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
 border:1px solid rgba(242,184,75,.45);background:rgba(242,184,75,.1);padding:5px 9px;border-radius:99px;white-space:nowrap}
.sub{color:var(--muted);margin:0;max-width:34ch}
/* meses */
.months{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px;scroll-snap-type:x proximity}
.months::-webkit-scrollbar{display:none}
.m{flex:0 0 auto;scroll-snap-align:center;min-width:48px;height:40px;border-radius:12px;border:1px solid var(--line);
 background:rgba(17,28,35,.7);color:var(--muted);font:600 13px var(--f-body);cursor:pointer;transition:.2s}
.m[aria-pressed=true]{background:var(--mint);color:#06281a;border-color:var(--mint);font-weight:700;box-shadow:0 0 22px rgba(61,220,151,.35)}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
/* mapa */
.mapcard{position:relative;border-radius:20px;border:1px solid var(--line);overflow:hidden;
 background:radial-gradient(90% 90% at 50% 0%,rgba(139,123,255,.10),rgba(8,14,18,.85));}
#map{display:block;width:100%;aspect-ratio:3300/1450;max-height:none;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
#map path{vector-effect:non-scaling-stroke;fill-opacity:.46;stroke:rgba(255,255,255,.2);stroke-width:.5;transition:fill .45s;cursor:pointer}
#map path.sel{fill-opacity:.72;stroke:#fff;stroke-width:1.6}
#globe{display:none;width:100%;aspect-ratio:1/1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapcard.g #globe{display:block}.mapcard.g #map{display:none}
.mapcard{box-shadow:inset 0 0 60px rgba(61,140,255,.10)}
.seg{position:absolute;right:10px;top:10px;display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(11,18,23,.82);border:1px solid var(--line);z-index:2}
.seg button{height:28px;padding:0 11px;border-radius:9px;border:0;background:transparent;color:var(--muted);font:700 12px var(--f-body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--mint);color:#06281a}
.load{position:absolute;inset:0;display:grid;place-items:center;font:600 12px var(--f-body);color:var(--muted);letter-spacing:.06em;pointer-events:none;transition:opacity .4s}
.glabel{position:absolute;left:0;top:0;opacity:0;pointer-events:none;display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:99px;background:rgba(11,18,23,.88);border:1px solid var(--line);font:700 12px var(--f-body);white-space:nowrap;z-index:2;transition:opacity .2s}
.fl{width:24px;height:16px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18);flex:none;display:block}
.fl.big{width:44px;height:29px;border-radius:5px}
.hide{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:rgba(17,28,35,.8);color:var(--fg);font:700 12px var(--f-body);cursor:pointer}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .3s}
.fold.off{grid-template-rows:0fr;opacity:0}
.foldin{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:10px}
.fold.off .foldin{visibility:hidden;transition:visibility 0s .35s}
.src{font-size:10.5px;color:var(--muted);margin:0}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(11,18,23,.85);color:var(--fg);font:600 18px var(--f-body);cursor:pointer}
.hint{position:absolute;left:12px;bottom:10px;font:600 10px var(--f-body);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;pointer-events:none}
.legend{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--soft-red),var(--amber),var(--mint))}
.lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.lab b{color:var(--fg);font-weight:600}
/* lista */
h2{font:700 20px var(--f-display);margin:0;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cnt{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tops{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
.tops::-webkit-scrollbar{display:none}
.top{flex:0 0 118px;border:1px solid var(--line);background:rgba(17,28,35,.75);border-radius:14px;padding:11px;text-align:left;color:var(--fg);cursor:pointer;font:inherit}
.top .fw2{display:block;margin-bottom:8px}.top .fw2 .fl{width:30px;height:20px}
.top .n{font:700 15px/1.15 var(--f-display);min-height:34px;display:block}
.top .s{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
input[type=search]{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(17,28,35,.8);color:var(--fg);padding:0 14px;font:500 14px var(--f-body)}
input::placeholder{color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(34,52,63,.7);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 46px;background:none;border-inline:0;border-top:0;color:var(--fg);font:inherit;text-align:left;width:100%}
.row .fw{flex:none;display:block}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .tp{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;width:48px;text-align:right}
.row .sc{font:700 13px var(--f-body);font-variant-numeric:tabular-nums;width:30px;text-align:right}
.note{color:var(--muted);font-size:11.5px;margin:0}
/* hoja */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(3,7,10,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:430px;max-height:86%;overflow-y:auto;
 background:linear-gradient(180deg,#14232C,#0F1A21);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
 padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
 transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-top h3{font:700 28px/1.05 var(--f-display);margin:0;letter-spacing:-.02em;min-width:0}
.x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font-size:16px;flex:none}
.verdict{display:flex;align-items:center;gap:14px;margin:16px 0}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.verdict p{margin:0;color:var(--muted)}
.verdict strong{display:block;color:var(--fg);font:700 17px var(--f-display)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border:1px solid var(--line);background:rgba(11,18,23,.55);border-radius:14px;padding:12px;min-width:0}
.st .k{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st .v{font:700 22px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.st .v small{font:500 12px var(--f-body);color:var(--muted);margin-left:4px}
.lv{display:flex;gap:3px;margin-top:8px}
.lv i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.lv i.on{background:var(--mint)}
.lv.warn i.on{background:var(--amber)}
.yr{margin-top:14px}
.yr .k{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cols{display:flex;align-items:flex-end;gap:4px;height:64px}
.cols div{flex:1;border-radius:4px 4px 2px 2px;min-height:4px;opacity:.55}
.cols div.cur{opacity:1;box-shadow:0 0 0 1.5px #fff}
.cl{display:flex;gap:4px;margin-top:4px}
.cl span{flex:1;text-align:center;font-size:9.5px;color:var(--muted)}
.ex{margin:14px 0 0;font-size:11.5px;color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="app">

    <div class="fold" id="fold"><div class="foldin"><input type="search" id="q" autocomplete="off">
    <div class="list" id="list"></div></div></div>
      </section>
</main>

<div class="scrim" id="scrim"></div>

function flyTo(c,dur){var T=viewFor(Math.max(-1.1,Math.min(1.1,c.lat*Math.PI/180*.85)),c.lon*Math.PI/180);
  if(reduce){M=T;fly=null;return}
  var R=mmul(T,mtr(M)),tr=R[0]+R[4]+R[8],ang=Math.acos(Math.max(-1,Math.min(1,(tr-1)/2))),ax=[R[7]-R[5],R[2]-R[6],R[3]-R[1]];
  if(Math.hypot(ax[0],ax[1],ax[2])<1e-6){ax=[0,1,0]}
  fly={t:performance.now(),d:dur*(0.6+0.4*Math.min(1,ang/2)),M0:M,ax:ax,ang:ang};vx=vy=0}
function loop(ts){
  requestAnimationFrame(loop);
  if(!globeOn||!S||!vis||document.hidden)return;
  var now=performance.now(),active=gdrag||fly||Math.abs(vx)+Math.abs(vy)>.01;
  var el=ts-lastDraw;if(!active&&el<32)return;
  var dt=Math.min(.064,el/1000);lastDraw=ts;
  if(fly){var u=Math.min(1,(now-fly.t)/fly.d),e=ease(u);M=ortho(mmul(rotAxis(fly.ax[0],fly.ax[1],fly.ax[2],fly.ang*e),fly.M0));
    if(u>=1){fly=null;pauseUntil=Math.max(pauseUntil,now+(sel>=0?1e9:3500))}}
  else if(!gdrag){
    if(Math.abs(vx)+Math.abs(vy)>.01){M=ortho(mmul(mmul(rotAxis(1,0,0,vy*dt),rotAxis(0,1,0,vx*dt)),M));var f=Math.exp(-dt*2.6);vx*=f;vy*=f}
    else if(now>pauseUntil&&!reduce){M=ortho(mmul(M,rotAxis(0,1,0,.045*dt)))}}

  renderGlobe(ts);
}
var pts={},pinch0=0,zm0=1,lastMoveT=0;

G.addEventListener("pointerdown",function(e){G.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=Object.keys(pts).length;pauseUntil=performance.now()+1e9;fly=null;
  if(n===1){gdrag=true;gmoved=0;vx=vy=0;lastMoveT=performance.now()}else if(n===2){pinch0=dist();zm0=zm;gmoved=99}});
G.addEventListener("pointermove",function(e){var p=pts[e.pointerId];if(!p)return;var n=Object.keys(pts).length;
  if(n===2){p.x=e.clientX;p.y=e.clientY;if(pinch0>0)zm=Math.max(.7,Math.min(2.4,zm0*dist()/pinch0));return}
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;gmoved+=Math.abs(dx)+Math.abs(dy);
  if(gmoved<=14)return;
  var rc=G.clientWidth/2*.9*zm,ay=dx/rc,ax=dy/rc,now=performance.now(),dtm=Math.max(8,now-lastMoveT);lastMoveT=now;
  M=ortho(mmul(mmul(rotAxis(1,0,0,ax),rotAxis(0,1,0,ay)),M));
  vx=.7*vx+.3*(ay/dtm*1000);vy=.7*vy+.3*(ax/dtm*1000)});

  if(n>0){gmoved=99;return}
  gdrag=false;var now=performance.now();pauseUntil=now+3000;
  if(now-lastMoveT>90){vx=vy=0}
  var m=Math.hypot(vx,vy);if(m>6){vx*=6/m;vy*=6/m}

G.addEventListener("pointerup",gup);G.addEventListener("pointercancel",gup);
G.addEventListener("wheel",function(e){e.preventDefault();zm=Math.max(.7,Math.min(2.4,zm*Math.exp(-e.deltaY*.0015)));pauseUntil=performance.now()+3000},{passive:false});
function pickGlobe(cx,cy){var r=G.getBoundingClientRect(),s=GN/r.width,x=((cx-r.left)*s-GN/2)/GR,y=(GN/2-(cy-r.top)*s)/GR,rho2=x*x+y*y;if(rho2>=1)return -1;
  var z=Math.sqrt(1-rho2),wx=M[0]*x+M[3]*y+M[6]*z,wy=M[1]*x+M[4]*y+M[7]*z,wz=M[2]*x+M[5]*y+M[8]*z,lat=Math.asin(Math.max(-1,Math.min(1,wy))),lon=Math.atan2(wx,wz);
  var fu=lon/(2*Math.PI)+.5;fu-=Math.floor(fu);var u=Math.min(QW-1,(fu*QW)|0),v=Math.min(QH-1,Math.max(0,((Math.PI/2-lat)/Math.PI*QH)|0));return Q[v*QW+u]-1}
