<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ECLIPTA · Ruta del vuelo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<script>window.ECL=/*ECLIPTA*/{};</script>
<script>window.RMAP=/*ROUTEMAP*/{};</script>
<script>/*MAPLIBRE*/</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* La Ruta del vuelo: un globo terráqueo de verdad (MapLibre + mapa de
   OpenStreetMap), con tu ruta, el avión que vuela por ella, el lado de la
   Tierra donde ahora es de noche y las fichas de las dos ciudades. */
:root{--bg:#060B12;--ink:#F2F5F3;--mut:#9FB0B8;--card:rgba(13,22,32,.86);--line:rgba(120,160,200,.18);--o:#6CA8FF;--d:#FF8A65;--ok:#3DDC97;--gold:#FFD27A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
.h{font-family:'Bricolage Grotesque','Manrope',sans-serif;font-weight:800;letter-spacing:-.01em}
/* El espacio con estrellas detrás del globo */
#space{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 30%,#0D2140 0%,#060B12 60%,#03060A 100%)}
#space i{position:absolute;inset:0;background-repeat:repeat;opacity:.8}
#space i.s1{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 140px 80px,#cfe3ff,transparent),radial-gradient(1.5px 1.5px at 90px 160px,#fff,transparent),radial-gradient(1px 1px at 200px 120px,#fff,transparent);background-size:240px 220px;animation:tw 5s ease-in-out infinite}
#space i.s2{background-image:radial-gradient(1px 1px at 60px 90px,#fff,transparent),radial-gradient(1.5px 1.5px at 170px 20px,#ffe9c9,transparent),radial-gradient(1px 1px at 120px 190px,#fff,transparent);background-size:260px 240px;animation:tw 7s ease-in-out 2s infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.35}}
#map{position:fixed;inset:0}
#fb{position:fixed;inset:0;width:100%;height:100%;display:none}
.maplibregl-map{position:relative;overflow:hidden}
.maplibregl-canvas-container{position:absolute;inset:0}
.maplibregl-canvas{position:absolute;left:0;top:0;outline:none}
.maplibregl-marker{position:absolute;top:0;left:0}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
/* Arriba: atrás, título y "Mundo" */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 26px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(6,11,18,.92),rgba(6,11,18,.55) 70%,transparent);z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.rb{width:44px;height:44px;flex-shrink:0;border-radius:22px;background:rgba(20,30,37,.85);border:1px solid #26363F;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rb:active{transform:scale(.94)}
#ttl{flex:1;min-width:0;display:flex;flex-direction:column}
#ttl b{font-size:21px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ttl span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* La etiqueta del momento y "por dónde pasa" */
#chip{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 72px);z-index:4;height:28px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;background:rgba(10,18,26,.8);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:calc(100% - 28px)}
#chip i{width:8px;height:8px;border-radius:4px;background:var(--o);box-shadow:0 0 0 0 rgba(108,168,255,.7);animation:pl 1.8s infinite;flex-shrink:0}
#chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(108,168,255,.7)}100%{box-shadow:0 0 0 10px rgba(108,168,255,0)}}
#night{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 106px);z-index:4;height:28px;border-radius:14px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:#C9D6DE;background:rgba(10,18,26,.7);border:1px solid var(--line)}
#night svg{flex-shrink:0}
/* Marcas de los aeropuertos y el avión (encima del mapa) */
.apt{position:relative;width:0;height:0}
.apt .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:7px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.apt .ring{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:16px;border:2px solid;animation:ring 2s ease-out infinite}
.apt .ring.b{animation-delay:1s}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
.apt .lbl{position:absolute;left:0;bottom:14px;transform:translateX(-50%);white-space:nowrap;height:26px;border-radius:13px;padding:0 10px 0 6px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#0B1217;box-shadow:0 6px 14px -4px rgba(0,0,0,.6);animation:lblin .6s cubic-bezier(.2,.9,.3,1.3) both}
.apt .lbl em{font-style:normal;font-size:15px;line-height:1}
@keyframes lblin{from{opacity:0;transform:translate(-50%,8px) scale(.8)}}
#plane{width:54px;height:54px;pointer-events:none}
#plane svg{width:54px;height:54px;filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
/* La hoja de abajo */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:62%;overflow-y:auto;overscroll-behavior:contain;padding:0 12px calc(env(safe-area-inset-bottom) + 12px);scrollbar-width:none}
#sheet::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -10px 40px -10px rgba(0,0,0,.6)}
.in>*{animation:up .55s cubic-bezier(.2,.9,.3,1.1) both}
.in>*:nth-child(2){animation-delay:.06s}.in>*:nth-child(3){animation-delay:.12s}.in>*:nth-child(4){animation-delay:.18s}.in>*:nth-child(5){animation-delay:.24s}.in>*:nth-child(6){animation-delay:.3s}.in>*:nth-child(7){animation-delay:.36s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.grab{width:40px;height:4px;border-radius:2px;background:#33434D;margin:0 auto 12px}
.btn{width:100%;height:54px;border-radius:18px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;color:#0B1217;background:linear-gradient(90deg,var(--o),#A9CCFF);box-shadow:0 10px 24px -10px var(--o);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 3.2s ease-in-out 1s infinite}
@keyframes sh{0%{left:-80px}60%,100%{left:110%}}
.btn.d{background:linear-gradient(90deg,var(--d),#FFC2A8);box-shadow:0 10px 24px -10px var(--d)}
.btn:active{transform:scale(.98)}
.lnk{display:block;width:100%;text-align:center;font-size:13.5px;font-weight:800;color:#9CC4FF;padding:12px 0 2px}
.row2{display:flex;gap:8px;margin-top:10px}
.ghost{flex:1;height:42px;border-radius:14px;border:1px solid #2A3C47;background:rgba(20,30,37,.7);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;color:#DCE6EC}
.ghost:active{transform:scale(.97)}
/* Tarjeta de embarque */
.pass{position:relative;border-radius:20px;background:linear-gradient(135deg,#132438,#0F1B24);border:1px solid #23405C;padding:14px 16px 12px;overflow:hidden}
.pass::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 100% 0%,rgba(255,138,101,.16),transparent 70%),radial-gradient(60% 80% at 0% 0%,rgba(108,168,255,.18),transparent 70%);pointer-events:none}
.ph{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.12em;color:#8FB6E0}
.pill{height:24px;border-radius:12px;padding:0 10px;display:flex;align-items:center;font-size:11.5px;font-weight:800;color:#0B1217;background:var(--ok);letter-spacing:0}
.pr{display:flex;align-items:flex-start;justify-content:space-between;margin-top:10px;gap:8px}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.side.r{align-items:flex-end;text-align:right}
.side .fl{font-size:26px;line-height:1}
.side .c{font-size:23px;line-height:1.1}
.side .n{font-size:11.5px;font-weight:700;color:#C9D6DE}
.side .k{font-size:11px;color:var(--mut)}
.side .t{font-size:11px;color:var(--mut);margin-top:4px}
.side .t b{color:var(--ink);font-size:13px}
.mid{width:96px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:16px}
.mid svg{overflow:visible}
.mid .du{font-size:12px;font-weight:800}
.fly{animation:fl 2.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.perf{position:relative;margin:12px -16px 10px;border-top:2px dashed #2B4560}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:9px;background:#0A121A}
.perf::before{left:-9px}.perf::after{right:-9px}
.pf{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pf span{font-size:12px;color:#C9D6DE}
.bar{display:flex;gap:2px;height:26px;align-items:stretch;opacity:.85}
.bar i{display:block;background:#DCE6EC;border-radius:1px}
/* Fichas de ciudad */
.ch{display:flex;align-items:center;gap:12px}
.ch .fl{width:52px;height:52px;border-radius:16px;background:#141E25;border:1px solid #26363F;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.ch .cc{flex:1;min-width:0}
.ch .cc b{display:block;font-size:26px;line-height:1.05}
.ch .cc span{font-size:12px;color:var(--mut)}
.tag{height:26px;flex-shrink:0;border-radius:13px;color:#0B1217;font-size:11px;font-weight:800;display:flex;align-items:center;padding:0 10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fact{border-radius:16px;background:rgba(20,30,37,.85);border:1px solid #26363F;padding:10px 12px;display:flex;gap:9px;align-items:center;min-width:0}
.fact .ic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fact div{min-width:0}
.fact small{display:block;font-size:10.5px;font-weight:700;color:var(--mut)}
.fact b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why{margin-top:10px;border-radius:16px;background:rgba(20,30,37,.85);border:1px solid #26363F;padding:12px 14px}
.why b{font-size:15px}
.why p{margin:6px 0 0;font-size:13px;line-height:1.5;color:#C9D6DE}
.why button{margin-top:6px;font-size:12.5px;font-weight:800;color:#9CC4FF}
.sh{margin:12px 2px 8px;font-size:15px}
.sights{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.sights::-webkit-scrollbar{display:none}
.sight{flex:0 0 138px;height:150px;border-radius:18px;position:relative;overflow:hidden;scroll-snap-align:start;background:#1A2732 center/cover no-repeat;border:1px solid #26363F;text-align:left}
.sight::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.82))}
.sight span{position:absolute;left:10px;right:10px;bottom:9px;z-index:1;font-size:12.5px;font-weight:800;line-height:1.25;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.sight .n{position:absolute;left:8px;top:8px;z-index:1;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.55);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* El vuelo: los datos en directo */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hc{border-radius:16px;background:rgba(20,30,37,.85);border:1px solid #26363F;padding:9px 10px}
.hc small{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.hc b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hc b em{font-style:normal;font-size:11px;color:var(--mut);margin-left:2px}
.prog{margin-top:12px}
.prog .pt{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#C9D6DE;margin-bottom:6px}
.track{position:relative;height:10px;border-radius:5px;background:#1A2A35;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--o),#fff 85%,var(--d))}
.track .pp{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;display:flex;align-items:center;justify-content:center}
.prof{margin-top:12px;height:58px;position:relative}
.prof svg{width:100%;height:58px;display:block}
.over{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;min-height:20px}
.over i{width:8px;height:8px;border-radius:4px;background:var(--gold);flex-shrink:0;animation:pl 1.8s infinite}
.over span{animation:up .4s both}
.sim{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#8FB6E0;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sim .live{height:18px;border-radius:9px;background:#E5484D;color:#fff;font-size:9.5px;padding:0 7px;display:flex;align-items:center;letter-spacing:.06em;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
/* Llegada */
.hello{text-align:center;padding:4px 0 8px}
.hello b{font-size:22px;display:block}
.conf{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.conf i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.2}}
.cred{text-align:center;font-size:10.5px;color:#6E8290;margin-top:10px}
</style>
</head>
<body>
<div id="space"><i class="s1"></i><i class="s2"></i></div>
<div id="map"></div>
<canvas id="fb"></canvas>
<div id="top">
  <button class="rb" id="bk" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div id="ttl"><b class="h" id="tt"></b><span id="ts"></span></div>
  <button class="rb" id="gw" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5F3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
</div>
<div id="chip"><i></i><span id="chipT"></span></div>
<div id="night"><svg width="12" height="12" viewBox="0 0 24 24" fill="#C9D6DE" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 1 1 8.7 4a7 7 0 0 0 11.3 11.3z"/></svg><span id="nightT"></span></div>
<div id="sheet"></div>
<div class="conf" id="conf"></div>
<script>
(function(){
'use strict';
var E = window.ECL || {}, M = window.RMAP || {};
function toApp(m){ try { if (window.ECLIPTA) window.ECLIPTA.postMessage(m); } catch (e) {} }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function okUrl(u){ return typeof u === 'string' && /^https:\/\/[^\s"'()\\<>]+$/.test(u) ? u : ''; }
var $ = function(id){ return document.getElementById(id); };
var lastMk = '', stage = 'world', anim = null, orbit = null, lastArrive = E.arrive || 0, map = null, ready = false, plane = null, mk = {};
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Geometría ----------
var R = Math.PI / 180;
function route(){ return Array.isArray(E.route) && E.route.length > 1 ? E.route : null; }
function cum(rt){ // distancias acumuladas (en grados de arco, vale para repartir)
  var c = [0];
  for (var i = 1; i < rt.length; i++) {
    var a = rt[i-1], b = rt[i];
    var dl = (b[0]-a[0]) * Math.cos((a[1]+b[1]) / 2 * R), dp = b[1]-a[1];
    c.push(c[i-1] + Math.sqrt(dl*dl + dp*dp));
  }
  return c;
}
function at(rt, c, p){ // punto y rumbo a una fracción p del camino
  var L = c[c.length-1] * Math.max(0, Math.min(1, p)), i = 1;
  while (i < c.length - 1 && c[i] < L) i++;
  var a = rt[i-1], b = rt[i], f = c[i] - c[i-1] > 0 ? (L - c[i-1]) / (c[i] - c[i-1]) : 0;
  var pt = [a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f];
  var y = Math.sin((b[0]-a[0])*R) * Math.cos(b[1]*R);
  var x = Math.cos(a[1]*R)*Math.sin(b[1]*R) - Math.sin(a[1]*R)*Math.cos(b[1]*R)*Math.cos((b[0]-a[0])*R);
  return { p: pt, brg: (Math.atan2(y, x) / R + 360) % 360 };
}
function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
// La noche: el sol está encima del punto (lonSol, decl); la línea del día
// y la noche se calcula para cada longitud.
function nightPoly(){
  var now = new Date(), d = (now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 864e5;
  var decl = -23.44 * Math.cos(2 * Math.PI / 365 * (d + 10));
  var hrs = now.getUTCHours() + now.getUTCMinutes() / 60;
  var sunLon = (12 - hrs) * 15;
  var t = Math.tan(decl * R), pts = [];
  if (Math.abs(t) < 1e-4) t = 1e-4;
  for (var lon = -180; lon <= 180; lon += 3) {
    var lat = Math.atan(-Math.cos((lon - sunLon) * R) / t) / R;
    pts.push([lon, lat]);
  }
  var pole = decl > 0 ? -90 : 90;
  pts.push([180, pole]); pts.push([-180, pole]); pts.push(pts[0]);
  return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [pts] } };
}

// ---------- El mapa ----------
function hasGL(){
  try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; }
}
function startMap(){
  if (!window.maplibregl || !M.style || !hasGL()) { fallback(); return; }
  var style = JSON.parse(JSON.stringify(M.style));
  if (M.land && style.sources && style.sources.land) style.sources.land.data = M.land;
  var rt = route(), o = E.o;
  try {
    map = new maplibregl.Map({
      container: 'map', style: style, attributionControl: false,
      center: o ? [o.lon, o.lat] : [0, 20], zoom: 1.2, pitch: 0,
      maxPitch: 70, fadeDuration: 150, renderWorldCopies: false,
      dragRotate: true, touchPitch: true
    });
  } catch (e) { fallback(); return; }
  window.ECLmap = map;
  map.on('error', function(){ /* sin teselas: se ve la tierra de la app */ });
  map.on('load', function(){
    ready = true;
    map.addSource('night', { type: 'geojson', data: nightPoly() });
    map.addLayer({ id: 'night', type: 'fill', source: 'night', paint: { 'fill-color': '#000814', 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 2, 0.42, 6, 0.18, 8, 0] } });
    map.addSource('rt', { type: 'geojson', lineMetrics: true, data: line(rt || []) });
    map.addLayer({ id: 'rt-glow', type: 'line', source: 'rt', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#6CA8FF', 'line-width': 10, 'line-opacity': .16, 'line-blur': 6 } });
    map.addLayer({ id: 'rt-dash', type: 'line', source: 'rt', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#BBD6FF', 'line-width': 2, 'line-opacity': .65, 'line-dasharray': [1.5, 2] } });
    map.addLayer({ id: 'rt-done', type: 'line', source: 'rt', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-width': 4.5, 'line-gradient': grad(0) } });
    setInterval(function(){ var s = map.getSource('night'); if (s) s.setData(nightPoly()); }, 60000);
    markers();

  var c = $('conf'), cols = ['#6CA8FF', '#FF8A65', '#FFD27A', '#3DDC97', '#B48CFF', '#fff'], h = '';
  for (var i = 0; i < 46; i++) h += '<i style="left:' + (Math.random() * 100) + '%;background:' + cols[i % cols.length] + ';--dx:' + Math.round(Math.random() * 160 - 80) + 'px;animation-delay:' + (Math.random() * .6).toFixed(2) + 's"></i>';
  c.innerHTML = h;
  setTimeout(function(){ c.innerHTML = ''; }, 3400);
}

// ---------- Botones de arriba y datos nuevos de la app ----------
$('bk').addEventListener('click', function(){ toApp('back'); });
$('gw').addEventListener('click', function(){ go('world'); });
window.ECLin = function(d){
  var before = JSON.stringify([E.route, E.o && E.o.lat, E.d && E.d.lat]);
  for (var k in d) E[k] = d[k];
  header();
  var changed = JSON.stringify([E.route, E.o && E.o.lat, E.d && E.d.lat]) !== before;
  if ((E.arrive || 0) > lastArrive) { lastArrive = E.arrive; markers(); go('d'); return; }
  if (changed) { markers(); go('world'); return; }
  var mkKey = JSON.stringify([E.o && [E.o.lbl, E.o.flag], E.d && [E.d.lbl, E.d.flag]]);
  if (mkKey !== lastMk) { lastMk = mkKey; markers(); }
  if (stage !== 'fly') {
    var y = $('sheet').scrollTop; render(); $('sheet').scrollTop = y;
  }
};
header();
render();
startMap();
if (!map) go('world', true);
})();
