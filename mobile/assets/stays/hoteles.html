<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ECLIPTA Hoteles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna movil 390x844. Cabecera, chips de monumento, tarjeta del monumento, mapa que ocupa el resto, hoja inferior de hotel. */
:root{
  --bg:#0B1217; --panel:#111c23; --panel2:#16252d; --line:rgba(255,255,255,.09);
  --mint:#3DDC97; --violet:#8B7CF6; --amber:#F5B84B; --red:#F07878;
  --ink:#E8F1EE; --mut:#8FA3A0;
  --display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow:hidden;
  background-image:radial-gradient(70% 38% at 85% 2%,rgba(139,124,246,.28),transparent 70%),radial-gradient(60% 40% at 0% 30%,rgba(61,220,151,.16),transparent 70%),radial-gradient(80% 30% at 50% 100%,rgba(139,124,246,.14),transparent 70%)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:8px 10px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font:800 17px var(--display);letter-spacing:.14em}
.brand svg{width:22px;height:22px}
.brand small{font:600 11px var(--body);letter-spacing:.02em;color:var(--mut);margin-left:2px}
.ex{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(245,184,75,.45);background:rgba(245,184,75,.1);padding:4px 9px;border-radius:99px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:rgba(22,37,45,.8);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mut);transition:.2s}
.chip svg{width:14px;height:14px}
.chip[aria-pressed=true]{background:var(--mint);color:#06281a;border-color:var(--mint);box-shadow:0 6px 20px -6px rgba(61,220,151,.7)}
/* tarjeta monumento */
.mon{flex:none;border-radius:22px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px -22px #000}
.art{position:relative;height:132px}
.art>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.art::after{content:"";position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(transparent,rgba(11,18,23,.92))}
.ttl{position:absolute;left:14px;right:14px;bottom:9px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ttl h1{margin:0;font:800 24px/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.ttl p:empty{display:none}
.ttl p{margin:2px 0 0;color:var(--mut);font-size:12px;font-weight:600}
.facts{text-align:right;font-size:11px;color:var(--mut);font-weight:600;line-height:1.35;white-space:nowrap}
.facts b{display:block;color:var(--ink);font:700 15px var(--display)}
.strip{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);border-top:1px solid var(--line);font-size:12px}
.strip .hn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-weight:600}
.strip .hn b{color:var(--ink);font-weight:700}
.strip .nv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-variant-numeric:tabular-nums}
.strip .nv span{color:var(--mut);font-size:10.5px}
.strip .nv strong{font:700 13px var(--body)}
.strip .tot strong{color:var(--mint)}
/* mapa */
.map{position:relative;flex:1;min-height:220px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#202a30;touch-action:none;user-select:none;-webkit-user-select:none;isolation:isolate}
.inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.inner.t3d{transform:translate(-50%,-47%) perspective(820px) rotateX(46deg)}
.inner canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(8,13,17,.7);border-radius:inherit;z-index:3}
.haze{position:absolute;inset:0 0 auto 0;height:0;background:linear-gradient(#0f191f,transparent);z-index:2;pointer-events:none;transition:height .5s}
.t3d-on .haze{height:34%}
.pin{position:absolute;left:0;top:0;z-index:4;transform-origin:50% 100%;will-change:transform;cursor:pointer}
.pin .pl{position:relative;display:flex;align-items:center;gap:4px;padding:4px 8px 4px 6px;border-radius:99px;font:800 12px var(--body);letter-spacing:-.01em;color:#071117;box-shadow:0 5px 12px -3px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.45);font-variant-numeric:tabular-nums;border:1.5px solid rgba(7,17,23,.55);white-space:nowrap}
.pin .pl i{width:7px;height:7px;border-radius:50%;background:rgba(7,17,23,.7)}
.pin .pl::after{content:"";position:absolute;left:50%;bottom:-6px;width:9px;height:9px;background:inherit;transform:translateX(-50%) rotate(45deg);border-right:1.5px solid rgba(7,17,23,.55);border-bottom:1.5px solid rgba(7,17,23,.55);border-radius:0 0 3px 0;z-index:-1}
.pin.g .pl{background:linear-gradient(#6df0b6,#37d392)}
.pin.a .pl{background:linear-gradient(#ffd37a,#f0aa38)}
.pin.r .pl{background:linear-gradient(#ff9e9e,#e96a6a)}
.pin.n .pl{background:linear-gradient(#ded8ff,#a596fa)}
.pin.sel{z-index:6}
.pin.sel .pl{transform:scale(1.22);transform-origin:50% 130%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 10px 22px -4px #000}
.pin.best::before{content:attr(data-best);position:absolute;left:50%;top:-17px;transform:translateX(-50%);font:700 9px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mint);background:rgba(8,16,20,.9);padding:2px 6px;border-radius:99px;border:1px solid rgba(61,220,151,.5);white-space:nowrap}
.mpin{position:absolute;left:0;top:0;z-index:5;pointer-events:none;transform-origin:50% 100%}
.mpin .b{display:flex;flex-direction:column;align-items:center;gap:2px}
.mpin .nm{font:800 11px var(--display);letter-spacing:.02em;background:rgba(8,16,20,.88);border:1px solid rgba(61,220,151,.7);color:var(--ink);padding:3px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 0 18px rgba(61,220,151,.45)}
.mpin .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#b9ffe0,#3DDC97 60%,#1a8f5f);box-shadow:0 0 0 6px rgba(61,220,151,.25),0 0 0 14px rgba(61,220,151,.1);animation:pulse 2.6s infinite}
.mpin .dot svg{width:18px;height:18px}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(61,220,151,.18),0 0 0 22px rgba(61,220,151,0)}}
.ctrl{position:absolute;right:10px;top:10px;z-index:7;display:flex;flex-direction:column;gap:7px}
.ctrl button{width:38px;height:38px;border-radius:12px;background:rgba(14,24,30,.86);border:1px solid var(--line);display:grid;place-items:center;font:700 18px var(--body);backdrop-filter:blur(8px)}
.ctrl button[aria-pressed=true]{background:var(--mint);color:#06281a}
.ctrl svg{width:19px;height:19px}
.leg{position:absolute;left:10px;top:10px;z-index:7;display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:12px;background:rgba(14,24,30,.86);border:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--mut);backdrop-filter:blur(8px)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:50%}
.leg .l{display:flex;align-items:center;gap:6px}
.credit{position:absolute;left:10px;bottom:8px;z-index:7;font-size:10px;color:rgba(232,241,238,.55);font-weight:600}
/* hoja */
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:9;background:rgba(17,28,35,.97);border:1px solid var(--line);border-radius:22px;box-shadow:0 -10px 40px -10px #000;transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(14px);overflow:hidden}
.sheet.open{transform:none}
.sheet .ph{position:relative;height:104px}
.sheet .ph svg{width:100%;height:100%;display:block}
.sheet .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(8,14,18,.7);display:grid;place-items:center;font-size:18px;line-height:1}
.sheet .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font:800 19px/1.1 var(--display)}
.sub{display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:12px;font-weight:600;margin-top:3px}
.sub b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--panel2);border-radius:14px;padding:8px 10px;min-width:0}
.st span{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.st b{display:block;font:700 16px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.st small{color:var(--mut);font-size:10.5px}
.bk{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-variant-numeric:tabular-nums}
.bk div{display:flex;justify-content:space-between;color:var(--mut)}
.bk div b{color:var(--ink);font-weight:600}
.bk .tt{border-top:1px dashed var(--line);padding-top:6px;margin-top:3px;color:var(--ink);font-weight:700;font-size:15px}
.bk .tt b{color:var(--mint);font:800 20px var(--display)}
.sv{font-size:12px;color:var(--mint);font-weight:600}
.st input{display:block;width:100%;min-width:0;margin:0;padding:0 0 1px;background:none;border:0;border-bottom:1px dashed rgba(61,220,151,.6);color:var(--ink);font:700 16px var(--display);font-variant-numeric:tabular-nums;outline:none}
.st input::placeholder{color:var(--mint);opacity:.8;font:700 13px var(--body)}
.cta2{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700;color:var(--ink);background:var(--panel2)}
.cta{background:var(--mint);color:#06281a;font-weight:800;border-radius:14px;padding:11px;text-align:center}
.note{font-size:10.5px;color:var(--mut);text-align:center}
.step{display:inline-flex;align-items:center;gap:2px}
.step button{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);font-weight:800;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){.art{height:104px}.ttl h1{font-size:20px}}
</style>
